<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game 7 - Word Builder</title>

<style>
  body {
    font-family: Arial;
    text-align: center;
    background: #f5f7ff;
  }

  h1 { color: #2c3e50; }

  .word {
    display: inline-block;
    padding: 10px 15px;
    margin: 5px;
    background: #4CAF50;
    color: white;
    border-radius: 8px;
    cursor: pointer;
  }

  #words, #answer {
    margin-top: 20px;
    min-height: 50px;
    padding: 10px;
  }

  #answer {
    border: 2px dashed #999;
    width: 80%;
    margin: 20px auto;
    background: white;
  }

  button {
    margin: 10px;
    padding: 10px 15px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }

  .check { background: #2196F3; color: white; }
  .next { background: #FF9800; color: white; }

  #feedback {
    font-size: 22px;
    margin-top: 10px;
  }
</style>
</head>

<body>

<h1>🧩 Game 7: Word Builder</h1>

<h3>Arrange the words</h3>

<div id="words"></div>

<h3>Your sentence:</h3>
<div id="answer"></div>

<button class="check" onclick="checkAnswer()">Check ✅</button>
<button class="next" onclick="nextSentence()">Next ➡️</button>

<p id="feedback"></p>

<script>

// 🎯 Sentences + QUESTIONS + EMOJIS
const sentences = [
  // STATEMENTS
  { words: ["There", "is", "a", "cat"], answer: "There is a cat", emoji: "🐱😄" },
  { words: ["There", "is", "a", "dog"], answer: "There is a dog", emoji: "🐶😄" },
  { words: ["There", "is", "an", "owl"], answer: "There is an owl", emoji: "🦉😄" },
  { words: ["There", "are", "2", "cats"], answer: "There are 2 cats", emoji: "🐱🐱😍" },
  { words: ["There", "are", "2", "dogs"], answer: "There are 2 dogs", emoji: "🐶🐶😍" },

  // QUESTIONS ❓
  { words: ["Is", "there", "a", "cat", "?"], answer: "Is there a cat?", emoji: "❓🐱" },
  { words: ["Is", "there", "a", "dog", "?"], answer: "Is there a dog?", emoji: "❓🐶" },
  { words: ["Is", "there", "an", "owl", "?"], answer: "Is there an owl?", emoji: "❓🦉" },
  { words: ["Are", "there", "2", "cats", "?"], answer: "Are there 2 cats?", emoji: "❓🐱🐱" },
  { words: ["Are", "there", "2", "dogs", "?"], answer: "Are there 2 dogs?", emoji: "❓🐶🐶" }
];

let current = 0;
let answer = [];

function loadSentence() {
  answer = [];

  const s = sentences[current];
  const wordsDiv = document.getElementById("words");
  const answerDiv = document.getElementById("answer");
  const feedback = document.getElementById("feedback");

  wordsDiv.innerHTML = "";
  answerDiv.innerHTML = "";
  feedback.innerHTML = "";

  let shuffled = [...s.words].sort(() => Math.random() - 0.5);

  shuffled.forEach(w => {
    const btn = document.createElement("div");
    btn.className = "word";
    btn.innerText = w;

    btn.onclick = () => {
      answer.push(w);
      answerDiv.innerText = answer.join(" ");
    };

    wordsDiv.appendChild(btn);
  });
}

function checkAnswer() {
  const user = answer.join(" ");
  const correct = sentences[current].answer;
  const feedback = document.getElementById("feedback");

  if (user === correct) {
    feedback.innerHTML = "🎉 Correct! " + sentences[current].emoji + " ⭐";
    speakText("Correct!");

    setTimeout(() => {
      nextSentence();
    }, 1200);

  } else {
    feedback.innerHTML = "😕 Try again! ❌";
    speakText("Try again");
  }
}

function nextSentence() {
  current++;

  if (current >= sentences.length) {
    current = 0;
    alert("🎉 You finished all sentences and questions!");
  }

  loadSentence();
}

function speakText(text) {
  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = "en-US";
  speechSynthesis.speak(msg);
}

loadSentence();

</script>

</body>
</html>
