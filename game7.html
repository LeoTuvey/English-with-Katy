<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game 7 - Word Builder</title>

<style>
  body {
    font-family: Arial;
    background: linear-gradient(135deg, #e3f2fd, #fce4ec);
    text-align: center;
    margin: 0;
  }

  h1 {
    margin-top: 15px;
    color: #2c3e50;
  }

  /* TOP PANEL */
  #topBar {
    display: flex;
    justify-content: space-around;
    margin: 10px;
    font-size: 18px;
  }

  .box {
    background: white;
    padding: 10px 15px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }

  /* ANIMAL DISPLAY */
  #animal {
    font-size: 60px;
    margin: 10px;
  }

  /* WORD AREA */
  #words {
    margin: 10px;
  }

  .word {
    display: inline-block;
    padding: 10px 14px;
    margin: 5px;
    background: #4CAF50;
    color: white;
    border-radius: 12px;
    cursor: pointer;
    font-size: 16px;
    transition: 0.2s;
  }

  .word:hover {
    transform: scale(1.05);
  }

  /* ANSWER BOX */
  #answer {
    border: 2px dashed #666;
    min-height: 50px;
    width: 80%;
    margin: 20px auto;
    padding: 10px;
    border-radius: 10px;
    background: white;
    font-size: 18px;
  }

  /* BUTTONS */
  button {
    padding: 10px 16px;
    margin: 10px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
  }

  .check { background: #2196F3; color: white; }
  .next { background: #FF9800; color: white; }

  /* FEEDBACK */
  #feedback {
    font-size: 26px;
    margin: 10px;
  }
</style>
</head>

<body>

<h1>🧩 Game 7: Word Builder</h1>

<div id="topBar">
  <div class="box">📍 Level: <span id="level">1</span></div>
  <div class="box">⭐ Score: <span id="score">0</span></div>
  <div class="box">📊 Progress: <span id="progress">1</span></div>
</div>

<div id="animal"></div>

<div id="words"></div>
<div id="answer"></div>

<button class="check" onclick="checkAnswer()">Check ✅</button>
<button class="next" onclick="nextSentence()">Next ➡️</button>

<div id="feedback"></div>

<script>

// 🧠 LONG GAME (20 SENTENCES + QUESTIONS)
const sentences = [
  { words: ["There", "is", "a", "cat"], answer: "There is a cat", emoji: "🐱" },
  { words: ["There", "is", "a", "dog"], answer: "There is a dog", emoji: "🐶" },
  { words: ["There", "is", "an", "owl"], answer: "There is an owl", emoji: "🦉" },
  { words: ["There", "is", "an", "apple"], answer: "There is an apple", emoji: "🍎" },

  { words: ["There", "are", "2", "cats"], answer: "There are 2 cats", emoji: "🐱🐱" },
  { words: ["There", "are", "2", "dogs"], answer: "There are 2 dogs", emoji: "🐶🐶" },
  { words: ["There", "are", "2", "apples"], answer: "There are 2 apples", emoji: "🍎🍎" },
  { words: ["There", "are", "2", "rabbits"], answer: "There are 2 rabbits", emoji: "🐰🐰" },

  // QUESTIONS
  { words: ["Is", "there", "a", "cat", "here?"], answer: "Is there a cat here?", emoji: "❓🐱" },
  { words: ["Is", "there", "a", "dog", "here?"], answer: "Is there a dog here?", emoji: "❓🐶" },
  { words: ["Is", "there", "an", "owl", "here?"], answer: "Is there an owl here?", emoji: "❓🦉" },

  { words: ["Are", "there", "2", "cats", "there?"], answer: "Are there 2 cats there?", emoji: "❓🐱🐱" },
  { words: ["Are", "there", "2", "dogs", "there?"], answer: "Are there 2 dogs there?", emoji: "❓🐶🐶" },
  { words: ["Are", "there", "2", "apples", "there?"], answer: "Are there 2 apples there?", emoji: "❓🍎🍎" },

  // EXTRA PRACTICE
  { words: ["There", "is", "a", "rabbit"], answer: "There is a rabbit", emoji: "🐰" },
  { words: ["There", "are", "2", "owls"], answer: "There are 2 owls", emoji: "🦉🦉" },
  { words: ["Is", "there", "an", "apple", "here?"], answer: "Is there an apple here?", emoji: "❓🍎" },
  { words: ["Are", "there", "2", "rabbits", "there?"], answer: "Are there 2 rabbits there?", emoji: "❓🐰🐰" }
];

let current = 0;
let answer = [];
let score = 0;

function normalize(text) {
  return text.toLowerCase().trim().replace(/\s+/g, " ").replace(" ?", "?");
}

function loadSentence() {
  answer = [];

  const s = sentences[current];

  document.getElementById("animal").innerText = s.emoji;
  document.getElementById("progress").innerText = current + 1;

  const wordsDiv = document.getElementById("words");
  const answerDiv = document.getElementById("answer");
  const feedback = document.getElementById("feedback");

  wordsDiv.innerHTML = "";
  answerDiv.innerHTML = "";
  feedback.innerHTML = "";

  let shuffled = [...s.words].sort(() => Math.random() - 0.5);

  shuffled.forEach(w => {
    const btn = document.createElement("div");
    btn.className = "word";
    btn.innerText = w;

    btn.onclick = () => {
      answer.push(w);
      answerDiv.innerText = answer.join(" ");
    };

    wordsDiv.appendChild(btn);
  });
}

function checkAnswer() {
  const user = normalize(answer.join(" "));
  const correct = normalize(sentences[current].answer);

  if (user === correct) {
    score += 10;
    document.getElementById("score").innerText = score;

    document.getElementById("feedback").innerHTML =
      "🎉 Correct! " + sentences[current].emoji;

    speak("Correct!");

    setTimeout(nextSentence, 1200);
  } else {
    document.getElementById("feedback").innerHTML =
      "😕 Try again!";
  }
}

function nextSentence() {
  current++;

  if (current >= sentences.length) {
    current = 0;
    alert("🎉 You finished ALL levels! Score: " + score);
  }

  loadSentence();
}

function speak(text) {
  speechSynthesis.speak(new SpeechSynthesisUtterance(text));
}

loadSentence();

</script>

</body>
</html>
