<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>English with Katy</title>

<style>
  body {
    font-family: Arial;
    margin: 0;
    background: linear-gradient(135deg, #e3f2fd, #fce4ec);
    text-align: center;
  }

  h1 {
    margin-top: 20px;
    color: #2c3e50;
  }

  .subtitle {
    color: #555;
    margin-bottom: 20px;
  }

  #container {
    width: 90%;
    max-width: 500px;
    margin: auto;
  }

  .section-title {
    text-align: left;
    margin: 15px 5px;
    font-weight: bold;
    color: #444;
  }

  .game {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: white;
    padding: 15px;
    margin: 10px 0;
    border-radius: 15px;
    text-decoration: none;
    color: black;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
  }

  .left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .emoji {
    font-size: 28px;
  }

  .status {
    font-size: 14px;
    padding: 6px 10px;
    border-radius: 10px;
    background: #eee;
    min-width: 90px;
    text-align: center;
  }

  .done { background: #c8f7c5; }
  .good { background: #fff3cd; }
  .start { background: #e2e3e5; }

</style>
</head>

<body>

<h1>📚 English with Katy</h1>
<p class="subtitle">Your learning world 🎮</p>

<div id="container">

  <div class="section-title">🟢 Beginner</div>

  <a class="game" href="game1.html">
    <div class="left">
      <div class="emoji">🏃‍♂️</div>
      <div>Game 1 - Actions</div>
    </div>
    <div class="status" id="g1">Loading...</div>
  </a>

  <a class="game" href="game2.html">
    <div class="left">
      <div class="emoji">✔️❌</div>
      <div>Game 2 - True/False</div>
    </div>
    <div class="status" id="g2">Loading...</div>
  </a>

  <a class="game" href="game3.html">
    <div class="left">
      <div class="emoji">📍</div>
      <div>Game 3 - This/That</div>
    </div>
    <div class="status" id="g3">Loading...</div>
  </a>

  <div class="section-title">🟡 More Games</div>

  <a class="game" href="game4.html">
    <div class="left">
      <div class="emoji">🧠</div>
      <div>Game 4</div>
    </div>
    <div class="status" id="g4">Loading...</div>
  </a>

  <a class="game" href="game5.html">
    <div class="left">
      <div class="emoji">👆👇</div>
      <div>Game 5</div>
    </div>
    <div class="status" id="g5">Loading...</div>
  </a>

  <a class="game" href="game6.html">
    <div class="left">
      <div class="emoji">🔊</div>
      <div>Game 6</div>
    </div>
    <div class="status" id="g6">Loading...</div>
  </a>

  <a class="game" href="game7.html">
    <div class="left">
      <div class="emoji">🧩</div>
      <div>Game 7</div>
    </div>
    <div class="status" id="g7">Loading...</div>
  </a>

</div>

<script>

function getScore(game){
  return parseInt(localStorage.getItem(game + "_score")) || 0;
}

function getStatus(score){
  if(score >= 80) return "⭐⭐⭐ Done";
  if(score >= 40) return "⭐⭐ Good";
  if(score >= 10) return "⭐ Started";
  return "Play";
}

function update(){

  const games = ["game1","game2","game3","game4","game5","game6","game7"];

  games.forEach((g,i)=>{
    const score = getScore(g);
    const el = document.getElementById("g"+(i+1));
    if(el) el.innerText = getStatus(score);
  });

}

update();

</script>

</body>
</html>
