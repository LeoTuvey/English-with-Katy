<!DOCTYPE html>
<html lang="en">
<head>

<title>English with Katy</title>

<style>
  body {

    margin: 0;

  h1 {
    margin-top: 20px;
  }

  .subtitle {

  .game {

    background: white;
    padding: 15px;
    margin: 10px 0;
    border-radius: 15px;
    text-decoration: none;
    color: black;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);

  .left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .emoji {
    font-size: 28px;
  }

  .status {
    font-size: 14px;
    padding: 6px 10px;
    border-radius: 10px;

<body>

<h1>📚 English with Katy</h1>
<p class="subtitle">Your learning app 🎮</p>

<div id="container">

  <div class="section-title">🟢 Beginner</div>

  <a class="game" href="game1.html">
    <div class="left">
      <div class="emoji">🏃‍♂️</div>

    </div>
  </a>

  <a class="game" href="game2.html">

  </a>

  <div class="section-title">🟡 New Game</div>

  <a class="game" href="game4.html">
    <div class="left">
      <div class="emoji">🐱🐶</div>
      <div>Game 4 - Singular & Plural</div>
