<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>English with Katy - App</title>

<style>
  body {
    font-family: Arial;
    margin: 0;
    background: linear-gradient(135deg, #e3f2fd, #fce4ec);
    text-align: center;
  }

  h1 {
    margin-top: 20px;
    color: #2c3e50;
  }

  .subtitle {
    color: #555;
    margin-bottom: 20px;
  }

  #container {
    width: 90%;
    max-width: 500px;
    margin: auto;
  }

  .section-title {
    text-align: left;
    margin: 15px 5px;
    font-weight: bold;
    color: #444;
  }

  .game {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: white;
    padding: 15px;
    margin: 10px 0;
    border-radius: 15px;
    text-decoration: none;
    color: black;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    transition: 0.2s;
  }

  .game:hover {
    transform: scale(1.03);
  }

  .left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .emoji {
    font-size: 30px;
  }

  .title {
    font-size: 16px;
  }

  .status {
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 10px;
    background: #eee;
  }

  .done {
    background: #c8f7c5;
  }

</style>
</head>

<body>

<h1>📚 English with Katy</h1>
<p class="subtitle">One app. Many games. Daily learning 🎮</p>

<div id="container">

  <div class="section-title">🟢 Beginner Games</div>

  <a class="game" href="game1.html">
    <div class="left">
      <div class="emoji">🏃‍♂️</div>
      <div class="title">Daily Actions</div>
    </div>
    <div class="status">Play</div>
  </a>

  <a class="game" href="game2.html">
    <div class="left">
      <div class="emoji">✔️❌</div>
      <div class="title">True or False</div>
    </div>
    <div class="status">Play</div>
  </a>

  <a class="game" href="game3.html">
    <div class="left">
      <div class="emoji">📍</div>
      <div class="title">This / That</div>
    </div>
    <div class="status">Play</div>
  </a>

  <div class="section-title">🟡 Intermediate Games</div>

  <a class="game" href="game5.html">
    <div class="left">
      <div class="emoji">👆👇</div>
      <div class="title">Here vs There</div>
    </div>
    <div class="status">Play</div>
  </a>

  <a class="game" href="game6.html">
    <div class="left">
      <div class="emoji">🔊</div>
      <div class="title">Listening Game</div>
    </div>
    <div class="status">Play</div>
  </a>

  <div class="section-title">🔵 Advanced Games</div>

  <a class="game" href="game7.html">
    <div class="left">
      <div class="emoji">🧩</div>
      <div class="title">Word Builder</div>
    </div>
    <div class="status">Play</div>
  </a>

  <a class="game" href="game8.html">
    <div class="left">
      <div class="emoji">🖼️</div>
      <div class="title">Picture Phrase Match</div>
    </div>
    <div class="status">Play</div>
  </a>

</div>

</body>
</html>
