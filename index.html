<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>English with Katy</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f6ff;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #2c3e50;
      margin-bottom: 10px;
    }

    p {
      color: #555;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      max-width: 900px;
      margin: 30px auto;
    }

    .game-btn {
      background: white;
      border: 2px solid #4CAF50;
      padding: 20px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.2s;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .game-btn:hover {
      background: #4CAF50;
      color: white;
      transform: scale(1.05);
    }

    footer {
      margin-top: 30px;
      color: #888;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <h1>📚 English with Katy</h1>
  <p>Choose a game to start learning English 🎮✨</p>

  <div class="container">

    <button class="game-btn" onclick="location.href='game1.html'">
      🎯 Game 1: Daily Actions
    </button>

    <button class="game-btn" onclick="location.href='game2.html'">
      ❓ Game 2: True or False
    </button>

    <button class="game-btn" onclick="location.href='game3.html'">
      👆 Game 3: This / That
    </button>

    <button class="game-btn" onclick="location.href='game4.html'">
      🏆 Game 4: Score System
    </button>

    <button class="game-btn" onclick="location.href='game5.html'">
      📍 Game 5: Here / There
    </button>

    <button class="game-btn" onclick="location.href='game6.html'">
      🔊 Game 6: Voice Practice
    </button>

    <button class="game-btn" onclick="location.href='game7.html'">
      🧩 Game 7: Word Builder
    </button>

  </div>

  <footer>
    Made with ❤️ for English learners
  </footer>

</body>
</html>
