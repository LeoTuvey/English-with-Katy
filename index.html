<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>English with Katy</title>

<style>
  body {
    font-family: Arial;
    margin: 0;
    background: linear-gradient(135deg, #e3f2fd, #fce4ec);
    text-align: center;
  }

  h1 {
    margin-top: 20px;
    color: #2c3e50;
  }

  .subtitle {
    color: #555;
    margin-bottom: 20px;
  }

  #container {
    width: 90%;
    max-width: 500px;
    margin: auto;
  }

  .game {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: white;
    padding: 15px;
    margin: 10px 0;
    border-radius: 15px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    text-decoration: none;
    color: black;
  }

  .left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .emoji {
    font-size: 28px;
  }

  .title {
    font-size: 16px;
  }

  .status {
    font-size: 14px;
    padding: 6px 10px;
    border-radius: 10px;
    background: #eee;
    min-width: 90px;
    text-align: center;
  }

  .done { background: #c8f7c5; }
  .good { background: #fff3cd; }
  .start { background: #e2e3e5; }

</style>
</head>

<body>

<h1>📚 English with Katy</h1>
<p class="subtitle">Your learning progress 🎮</p>

<div id="container">

  <div class="game">
    <div class="left">
      <div class="emoji">🏃‍♂️</div>
      <div class="title">Game 1 - Daily Actions</div>
    </div>
    <div class="status" id="g1">Loading...</div>
  </div>

  <div class="game">
    <div class="left">
      <div class="emoji">✔️❌</div>
      <div class="title">Game 2 - True / False</div>
    </div>
    <div class="status" id="g2">Loading...</div>
  </div>

  <div class="game">
    <div class="left">
      <div class="emoji">📍</div>
      <div class="title">Game 3 - This / That</div>
    </div>
    <div class="status" id="g3">Loading...</div>
  </div>

</div>

<script>

// 📊 GET SCORE
function getScore(game) {
  return parseInt(localStorage.getItem(game + "_score")) || 0;
}

// ⭐ STATUS SYSTEM
function getStatus(score) {
  if (score >= 80) return { text: "⭐⭐⭐ Done", class: "done" };
  if (score >= 40) return { text: "⭐⭐ Good", class: "good" };
  if (score >= 10) return { text: "⭐ Started", class: "start" };
  return { text: "Play", class: "start" };
}

// 🔄 UPDATE UI
function update() {

  const games = ["game1", "game2", "game3"];

  games.forEach((g, i) => {

    const score = getScore(g);
    const status = getStatus(score);

    const el = document.getElementById("g" + (i + 1));
    el.innerText = status.text;
    el.className = "status " + status.class;

  });

}

update();

</script>

</body>
</html>
