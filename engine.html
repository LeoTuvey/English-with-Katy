<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>English with Katy</title>

<style>
body{
    font-family: Arial;
    background:#f5f9ff;
    margin:0;
    text-align:center;
}

header{
    background:#1976d2;
    color:white;
    padding:15px;
    font-size:20px;
}

.container{
    max-width:600px;
    margin:auto;
    padding:15px;
}

.lesson{
    background:white;
    margin:10px 0;
    padding:15px;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
    border:2px solid #eee;
}

.lesson:hover{
    border-color:#1976d2;
}
</style>
</head>

<body>

<header>
English with Katy 📘
</header>

<div class="container">

<h2>Your Learning Path</h2>

<div id="menu"></div>

</div>

<script>

/* ✅ FULL 7 GAME SYSTEM */

let lessons = [
{ name:"Game 1 - Actions 🏃‍♂️", file:"game1.html" },
{ name:"Game 2 - True/False ✔️❌", file:"game2.html" },
{ name:"Game 3 - This/That 📍", file:"game3.html" },
{ name:"Game 4 - Run After/From 🐱🐶", file:"game4.html" },
{ name:"Game 5 - Here/There 📍", file:"game5.html" },
{ name:"Game 6 - A / An 🍎", file:"game6.html" },
{ name:"Game 7 - One / Two / Some 🔢", file:"game7.html" }
];

function loadMenu(){

let html = "";

lessons.forEach((l,i)=>{
html += `
<div class="lesson" onclick="openLesson(${i})">
${l.name}
</div>
`;
});

document.getElementById("menu").innerHTML = html;
}

function openLesson(i){
window.location.href = lessons[i].file;
}

loadMenu();

</script>

</body>
</html>
