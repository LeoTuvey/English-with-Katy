<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>English with Katy - App</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background:#f5f9ff;
    margin:0;
    padding:0;
}

header{
    background:#1976d2;
    color:white;
    padding:15px;
    font-size:20px;
}

.container{
    max-width:600px;
    margin:auto;
    padding:15px;
}

.stats{
    display:flex;
    justify-content:space-around;
    margin:15px 0;
    font-size:18px;
}

.lesson{
    background:white;
    margin:10px 0;
    padding:15px;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    border:2px solid #eee;
}

.lesson.locked{
    opacity:0.4;
    cursor:not-allowed;
}

.lesson:hover:not(.locked){
    border-color:#1976d2;
}

button{
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#1976d2;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<header>
English with Katy 📘
</header>

<div class="container">

<div class="stats">
<div>❤️ Hearts: <span id="hearts">3</span></div>
<div>⭐ XP: <span id="xp">0</span></div>
</div>

<h2>Choose a Lesson</h2>

<div id="menu"></div>

<button onclick="resetProgress()">Reset Progress</button>

</div>

<script>

/* 🧠 APP DATA */
let hearts = 3;
let xp = 0;

/* LOAD FROM MEMORY */
if(localStorage.getItem("xp")){
xp = parseInt(localStorage.getItem("xp"));
}

let lessons = [
{ name:"Game 1 - Daily Actions", file:"game1.html", unlocked:true },
{ name:"Game 2 - True / False", file:"game2.html", unlocked:false },
{ name:"Game 3 - This / That", file:"game3.html", unlocked:false },
{ name:"Game 4 - Run After / From", file:"game4.html", unlocked:false },
{ name:"Game 5 - Here / There", file:"game5.html", unlocked:false },
{ name:"Game 6 - A / An", file:"game6.html", unlocked:false }
];

/* UNLOCK SYSTEM */
function loadUnlocks(){

let saved = localStorage.getItem("unlocked");

if(saved){
let data = JSON.parse(saved);
lessons.forEach((l,i)=>{
l.unlocked = data[i];
});
}

}

/* SAVE UNLOCKS */
function saveUnlocks(){
let data = lessons.map(l => l.unlocked);
localStorage.setItem("unlocked", JSON.stringify(data));
}

/* SHOW MENU */
function loadMenu(){

document.getElementById("xp").innerText = xp;

let html = "";

lessons.forEach((l,i)=>{

if(l.unlocked){
html += `
<div class="lesson" onclick="openLesson(${i})">
${l.name}
</div>`;
}else{
html += `
<div class="lesson locked">
🔒 ${l.name}
</div>`;
}

});

document.getElementById("menu").innerHTML = html;

}

/* OPEN LESSON */
function openLesson(i){
window.location.href = lessons[i].file;
}

/* RESET */
function resetProgress(){
localStorage.clear();
location.reload();
}

/* INIT */
loadUnlocks();
loadMenu();

</script>

</body>
</html>
