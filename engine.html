<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>English with Katy - Engine</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background:#f5f9ff;
    margin:0;
}

header{
    background:#1976d2;
    color:white;
    padding:15px;
    font-size:20px;
}

.container{
    max-width:600px;
    margin:auto;
    padding:15px;
}

.stats{
    display:flex;
    justify-content:space-around;
    margin:15px 0;
    font-size:18px;
}

.lesson{
    background:white;
    margin:10px 0;
    padding:15px;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    border:2px solid #eee;
}

.lesson.locked{
    opacity:0.4;
    cursor:not-allowed;
}

.lesson:hover:not(.locked){
    border-color:#1976d2;
}

button{
    padding:10px;
    margin-top:15px;
    border:none;
    border-radius:8px;
    background:#1976d2;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<header>
English with Katy 📘
</header>

<div class="container">

<div class="stats">
<div>❤️ Hearts: <span id="hearts">3</span></div>
<div>⭐ XP: <span id="xp">0</span></div>
</div>

<h2>Choose a Lesson</h2>

<div id="menu"></div>

<button onclick="resetProgress()">Reset Progress</button>

</div>

<script>

/* =======================
   BASIC PLAYER DATA
======================= */

let hearts = 3;

/* XP LOAD */
let xp = parseInt(localStorage.getItem("xp") || "0");
document.getElementById("xp").innerText = xp;

/* =======================
   LESSONS
======================= */

let lessons = [
{ name:"Game 1 - Daily Actions", file:"game1.html" },
{ name:"Game 2 - True / False", file:"game2.html" },
{ name:"Game 3 - This / That", file:"game3.html" },
{ name:"Game 4 - Run After / From", file:"game4.html" },
{ name:"Game 5 - Here / There", file:"game5.html" },
{ name:"Game 6 - A / An", file:"game6.html" }
];

/* =======================
   UNLOCK SYSTEM
======================= */

let unlocked = JSON.parse(localStorage.getItem("unlocked") || "[true,false,false,false,false,false]");

/* =======================
   SAVE SYSTEM
======================= */

function save(){
localStorage.setItem("unlocked", JSON.stringify(unlocked));
localStorage.setItem("xp", xp);
}

/* =======================
   OPEN LESSON
======================= */

function openLesson(i){
window.location.href = lessons[i].file;
}

/* =======================
   BUILD MENU
======================= */

function loadMenu(){

document.getElementById("xp").innerText = xp;

let html = "";

lessons.forEach((l,i)=>{

if(unlocked[i]){
html += `
<div class="lesson" onclick="openLesson(${i})">
${l.name}
</div>`;
}else{
html += `
<div class="lesson locked">
🔒 ${l.name}
</div>`;
}

});

document.getElementById("menu").innerHTML = html;

}

/* =======================
   RESET
======================= */

function resetProgress(){
localStorage.clear();
location.reload();
}

/* =======================
   INIT
======================= */

loadMenu();

</script>

</body>
</html>
