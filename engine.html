<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>English with Katy - Engine</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background:#f5f9ff;
    margin:0;
}

header{
    background:#1976d2;
    color:white;
    padding:15px;
    font-size:20px;
}

.container{
    max-width:600px;
    margin:auto;
    padding:15px;
}

.lesson{
    background:white;
    margin:10px 0;
    padding:15px;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    border:2px solid #eee;
}

.lesson.locked{
    opacity:0.4;
    cursor:not-allowed;
}

.lesson:hover:not(.locked){
    border-color:#1976d2;
}

h2{
    margin-top:20px;
}
</style>
</head>

<body>

<header>
English with Katy 📘
</header>

<div class="container">

<h2>Choose a Lesson</h2>

<div id="menu"></div>

</div>

<script>

/* =========================
   LESSON LIST (FIXED)
========================= */

let lessons = [
{ name:"Game 1 - Daily Actions", file:"game1.html", unlocked:true },
{ name:"Game 2 - True / False", file:"game2.html", unlocked:false },
{ name:"Game 3 - This / That", file:"game3.html", unlocked:false },
{ name:"Game 4 - Run After / From", file:"game4.html", unlocked:false },
{ name:"Game 5 - Here / There", file:"game5.html", unlocked:false },
{ name:"Game 6 - A / An", file:"game6.html", unlocked:false },
{ name:"Game 7 - One / Two / Some", file:"game7.html", unlocked:false }
];

/* =========================
   LOAD MENU
========================= */

function loadMenu(){

let html = "";

lessons.forEach((l,i)=>{

html += `
<div class="lesson ${l.unlocked ? '' : 'locked'}"
     onclick="${l.unlocked ? `openLesson(${i})` : ''}">
${l.unlocked ? l.name : '🔒 ' + l.name}
</div>
`;

});

document.getElementById("menu").innerHTML = html;
}

/* =========================
   OPEN LESSON
========================= */

function openLesson(i){
window.location.href = lessons[i].file;
}

/* =========================
   INIT
========================= */

loadMenu();

</script>

</body>
</html>
