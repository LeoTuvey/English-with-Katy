<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game 2 - True or False</title>

<style>
  body {
    font-family: Arial;
    background: linear-gradient(135deg, #e3f2fd, #fce4ec);
    text-align: center;
    margin: 0;
  }

  h1 {
    color: #2c3e50;
    margin-top: 10px;
  }

  #topBar {
    display: flex;
    justify-content: space-around;
    margin: 10px;
  }

  .box {
    background: white;
    padding: 10px 15px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }

  #statement {
    font-size: 30px;
    margin: 20px;
  }

  .btn {
    display: inline-block;
    padding: 12px 18px;
    margin: 10px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 18px;
    color: white;
  }

  .true { background: #4CAF50; }
  .false { background: #f44336; }

  #feedback {
    font-size: 24px;
    margin: 10px;
  }

  .next {
    background: #FF9800;
    color: white;
    padding: 10px 15px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 10px;
  }
</style>
</head>

<body>

<h1>✔️❌ Game 2: True or False</h1>

<div id="topBar">
  <div class="box">⭐ Score: <span id="score">0</span></div>
  <div class="box">📊 Level: <span id="level">1</span></div>
</div>

<div id="statement"></div>

<div>
  <div class="btn true" onclick="answer(true)">True ✔️</div>
  <div class="btn false" onclick="answer(false)">False ❌</div>
</div>

<p id="feedback"></p>

<button class="next" onclick="next()">➡️ Next</button>

<script>

// 💾 PROGRESS SYSTEM
function saveProgress(game, score) {
  localStorage.setItem(game + "_score", score);
}

function loadProgress(game) {
  return parseInt(localStorage.getItem(game + "_score")) || 0;
}

// 🎮 GAME DATA
const game = [
  { text: "🐱 A cat can fly", correct: false },
  { text: "🐶 A dog is an animal", correct: true },
  { text: "🍎 An apple is food", correct: true },
  { text: "🦉 An owl can swim", correct: false },
  { text: "🐰 A rabbit is small", correct: true },
  { text: "🚗 A car can fly", correct: false }
];

let current = 0;

// 🔥 LOAD SAVED SCORE
let score = loadProgress("game2");
document.getElementById("score").innerText = score;

function speak(text) {
  speechSynthesis.speak(new SpeechSynthesisUtterance(text));
}

function load() {
  const item = game[current];

  document.getElementById("statement").innerText = item.text;
  document.getElementById("level").innerText = current + 1;

  document.getElementById("feedback").innerText = "";
}

function answer(userChoice) {
  const correct = game[current].correct;

  if (userChoice === correct) {
    score += 10;
    document.getElementById("score").innerText = score;

    saveProgress("game2", score); // 💾 SAVE PROGRESS

    document.getElementById("feedback").innerText = "🎉 Correct!";
    speak("Correct");

  } else {
    document.getElementById("feedback").innerText = "😕 Try again!";
  }
}

function next() {
  current++;

  if (current >= game.length) {
    current = 0;
    alert("🎉 Finished Game 2! Score: " + score);
  }

  load();
}

load();

</script>

</body>
</html>
