<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>True or False Game</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background:#f5f7ff;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
    margin-bottom:10px;
}

#question{
    font-size:22px;
    margin:25px 0;
}

button{
    padding:12px;
    margin:10px;
    width:120px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.true{
    background:#4CAF50;
    color:white;
}

.false{
    background:#f44336;
    color:white;
}

#score{
    font-size:18px;
    margin:10px;
}

#result{
    font-size:20px;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<h1>✔ True or False Game ❌</h1>

<div id="score">Score: 0</div>

<div id="question"></div>

<button class="true" onclick="check(true)">TRUE</button>
<button class="false" onclick="check(false)">FALSE</button>

<div id="result"></div>

</div>

<script>

const questions = [
{q:"She is eating an apple now.", a:true},
{q:"They is playing football.", a:false},
{q:"He goes to school every day.", a:true},
{q:"We is happy.", a:false},
{q:"I am reading a book.", a:true},
{q:"Dogs is animals.", a:false},
{q:"The sun rises in the east.", a:true},
{q:"She play football every day.", a:false}
];

let current = 0;
let score = 0;

function load(){
    document.getElementById("question").innerHTML =
    questions[current].q;
}

function check(answer){

    if(answer === questions[current].a){
        score++;
        document.getElementById("result").innerHTML = "✅ Correct!";
    }else{
        document.getElementById("result").innerHTML = "❌ Wrong!";
    }

    document.getElementById("score").innerHTML =
    "Score: " + score;

    current++;

    if(current < questions.length){
        setTimeout(()=>{
            document.getElementById("result").innerHTML="";
            load();
        },1000);
    } else {
        document.getElementById("question").innerHTML =
        "🎉 Game Over!";
        document.getElementById("result").innerHTML =
        "Final Score: " + score + "/" + questions.length;
    }
}

load();

</script>

</body>
</html>
