<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>There is / There are</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background:linear-gradient(135deg,#84fab0,#8fd3f4);
    padding:20px;
}

.container{
    max-width:750px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 12px rgba(0,0,0,0.2);
}

h1{
    margin-bottom:10px;
}

.visual{
    font-size:90px;
    margin:25px 0;
}

button{
    width:90%;
    padding:14px;
    margin:8px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#4a90e2;
    color:white;
}

button:hover{
    opacity:0.9;
}

#score{
    font-size:18px;
    margin:10px;
}

#result{
    font-size:20px;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<h1>📍 There is / There are</h1>

<div id="score">Score: 0</div>

<div class="visual" id="visual"></div>

<div id="options"></div>

<div id="result"></div>

</div>

<script>

const questions = [
{
visual: "🥫📍",
answer: "There is a can here."
},
{
visual: "🐱🌳",
answer: "There is a cat there."
},
{
visual: "🐱🐱📍",
answer: "There are two cats here."
},
{
visual: "🐶🌳",
answer: "There is a dog there."
},
{
visual: "🦊🌳",
answer: "There is a fox there."
},
{
visual: "🐰📍",
answer: "There is a rabbit here."
}
];

const choices = [
"There is a can here.",
"There is a cat there.",
"There are two cats here.",
"There is a dog there.",
"There is a fox there.",
"There is a rabbit here."
];

let i = 0;
let score = 0;

function shuffle(array){
    return array.sort(() => Math.random() - 0.5);
}

function load(){

if(i >= questions.length){
document.getElementById("visual").innerHTML = "🎉";
document.getElementById("options").innerHTML = "";
document.getElementById("result").innerHTML =
"Game Finished! Score: " + score + "/" + questions.length;
return;
}

document.getElementById("visual").innerHTML =
questions[i].visual;

let answers = shuffle([...choices]).slice(0,3);

if(!answers.includes(questions[i].answer)){
answers[0] = questions[i].answer;
}

answers = shuffle(answers);

let html = "";

answers.forEach(opt=>{
html += `<button onclick="check('${opt}')">${opt}</button>`;
});

document.getElementById("options").innerHTML = html;
}

function check(answer){

if(answer === questions[i].answer){
score++;
document.getElementById("result").innerHTML = "✅ Correct!";
}else{
document.getElementById("result").innerHTML =
"❌ Wrong! Correct: " + questions[i].answer;
}

document.getElementById("score").innerHTML = "Score: " + score;

i++;

setTimeout(()=>{
document.getElementById("result").innerHTML = "";
load();
},1200);

}

load();

</script>

</body>
</html>
