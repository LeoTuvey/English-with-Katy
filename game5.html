<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HERE vs THERE - Clear Distance Game</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background:linear-gradient(135deg,#84fab0,#8fd3f4);
    padding:20px;
}

.container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
}

/* TITLE */
h1{
    margin-bottom:10px;
}

/* SCORE */
#score{
    margin:10px;
    font-size:18px;
}

/* SCENE */
.scene{
    position:relative;
    height:280px;
    border-radius:12px;
    margin:20px 0;
    background:linear-gradient(to top, #c2f0c2 40%, #87ceeb 60%);
}

/* HERE ZONE */
.here-zone{
    position:absolute;
    bottom:10px;
    left:10px;
    width:45%;
    height:90%;
    border:3px solid green;
    border-radius:12px;
    background:rgba(0,255,0,0.08);
}

/* THERE ZONE */
.there-zone{
    position:absolute;
    top:10px;
    right:10px;
    width:45%;
    height:90%;
    border:3px solid red;
    border-radius:12px;
    background:rgba(255,0,0,0.08);
}

/* LABELS */
.label{
    font-weight:bold;
    font-size:20px;
    margin-top:10px;
}

.here-label{
    color:green;
}

.there-label{
    color:red;
}

/* OBJECT */
.object{
    font-size:70px;
    position:absolute;
}

/* BUTTONS */
button{
    width:90%;
    padding:14px;
    margin:8px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#4a90e2;
    color:white;
}

#result{
    font-size:20px;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>📍 HERE vs THERE (Clear Distance Game)</h1>

<div id="score">Score: 0</div>

<div class="scene" id="scene"></div>

<div id="options"></div>

<div id="result"></div>

</div>

<script>

const questions = [
{
animal:"🐱",
position:"here",
answer:"There is a cat here."
},
{
animal:"🐶",
position:"there",
answer:"There is a dog there."
},
{
animal:"🐰",
position:"here",
answer:"There is a rabbit here."
},
{
animal:"🦊",
position:"there",
answer:"There is a fox there."
}
];

const choices = [
"There is a cat here.",
"There is a dog there.",
"There is a rabbit here.",
"There is a fox there."
];

let i = 0;
let score = 0;

function load(){

if(i >= questions.length){
document.getElementById("scene").innerHTML =
"🎉 Finished! Score: " + score;
document.getElementById("options").innerHTML = "";
return;
}

let q = questions[i];

document.getElementById("scene").innerHTML = `

<div class="here-zone">
<div class="label here-label">HERE (close to you)</div>
</div>

<div class="there-zone">
<div class="label there-label">THERE (far away)</div>
</div>

<div class="object" style="
    ${q.position === 'here'
        ? 'bottom:40px; left:25%;'
        : 'top:40px; right:25%;'
    }
">
${q.animal}
</div>

`;

let html = "";

choices.forEach(c=>{
html += `<button onclick="check('${c}')">${c}</button>`;
});

document.getElementById("options").innerHTML = html;
}

function check(ans){

if(ans === questions[i].answer){
score++;
document.getElementById("result").innerHTML = "✅ Correct!";
}else{
document.getElementById("result").innerHTML =
"❌ Correct answer: " + questions[i].answer;
}

document.getElementById("score").innerHTML = "Score: " + score;

i++;

setTimeout(()=>{
document.getElementById("result").innerHTML = "";
load();
},1200);

}

load();

</script>

</body>
</html>
