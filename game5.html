<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HERE vs THERE - Animals Game</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background:#e8f7ff;
    padding:20px;
}

.container{
    max-width:850px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
}

/* TITLE */
h1{
    margin-bottom:10px;
}

/* SCORE */
#score{
    font-size:18px;
    font-weight:bold;
    margin:10px;
}

/* GAME AREA */
.scene{
    position:relative;
    height:320px;
    margin:20px 0;
    border-radius:15px;
    border:3px solid #333;
    background:linear-gradient(to right, #c8f7c5 0%, #c8f7c5 45%, #ffcdd2 55%, #ffcdd2 100%);
}

/* CENTER LINE */
.line{
    position:absolute;
    left:50%;
    top:0;
    width:3px;
    height:100%;
    background:white;
}

/* LABELS */
.here-label{
    position:absolute;
    left:10px;
    top:10px;
    background:white;
    border:3px solid green;
    color:green;
    padding:6px 12px;
    font-weight:bold;
    border-radius:8px;
}

.there-label{
    position:absolute;
    right:10px;
    top:10px;
    background:white;
    border:3px solid red;
    color:red;
    padding:6px 12px;
    font-weight:bold;
    border-radius:8px;
}

/* OBJECT (ANIMALS) */
.object{
    position:absolute;
    font-size:80px;
    text-shadow:2px 2px 5px rgba(0,0,0,0.3);
}

/* BUTTONS */
button{
    width:90%;
    padding:14px;
    margin:8px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#1976d2;
    color:white;
    font-weight:bold;
}

button:hover{
    opacity:0.9;
}

/* RESULT */
#result{
    font-size:20px;
    margin-top:10px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>📍 HERE vs THERE - Animals Game</h1>

<div id="score">Score: 0</div>

<div class="scene" id="scene"></div>

<div id="options"></div>

<div id="result"></div>

</div>

<script>

const questions = [
{ obj:"🐱", pos:"here", answer:"There is a cat here." },
{ obj:"🐶", pos:"there", answer:"There is a dog there." },
{ obj:"🐰", pos:"here", answer:"There is a rabbit here." },
{ obj:"🦊", pos:"there", answer:"There is a fox there." },

// PLURAL (THERE ARE)
{ obj:"🐱🐱", pos:"there", answer:"There are two cats there." },
{ obj:"🐶🐶", pos:"here", answer:"There are two dogs here." },
{ obj:"🐰🐰", pos:"there", answer:"There are two rabbits there." }
];

const choices = [
"There is a cat here.",
"There is a dog there.",
"There is a rabbit here.",
"There is a fox there.",
"There are two cats there.",
"There are two dogs here.",
"There are two rabbits there."
];

let i = 0;
let score = 0;

function load(){

if(i >= questions.length){
document.getElementById("scene").innerHTML =
"🎉 Game Finished! Score: " + score;
document.getElementById("options").innerHTML = "";
return;
}

let q = questions[i];

document.getElementById("scene").innerHTML = `
<div class="here-label">HERE (close)</div>
<div class="there-label">THERE (far)</div>
<div class="line"></div>

<div class="object" style="
    ${q.pos === 'here'
        ? 'left:20%; bottom:40px;'
        : 'left:75%; top:60px;'
    }
">
${q.obj}
</div>
`;

let html = "";

choices.forEach(c=>{
html += `<button onclick="check('${c}')">${c}</button>`;
});

document.getElementById("options").innerHTML = html;
}

function check(ans){

if(ans === questions[i].answer){
score++;
document.getElementById("result").innerHTML = "✅ Correct!";
}else{
document.getElementById("result").innerHTML =
"❌ Correct: " + questions[i].answer;
}

document.getElementById("score").innerHTML = "Score: " + score;

i++;

setTimeout(()=>{
document.getElementById("result").innerHTML = "";
load();
},1200);

}

load();

</script>

</body>
</html>
