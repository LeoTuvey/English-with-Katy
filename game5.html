<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HERE vs THERE - Vertical Distance</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background:#e8f7ff;
    padding:20px;
}

.container{
    max-width:850px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
}

/* TITLE */
h1{
    margin-bottom:10px;
}

/* SCORE */
#score{
    font-size:18px;
    font-weight:bold;
    margin:10px;
}

/* MAIN SCENE */
.scene{
    position:relative;
    height:400px;
    margin:20px 0;
    border-radius:15px;
    border:3px solid #333;
    background:linear-gradient(to top, #c8f7c5 0%, #c8f7c5 40%, #90caf9 100%);
}

/* GROUND (HERE) */
.ground{
    position:absolute;
    bottom:0;
    width:100%;
    height:40%;
    background:rgba(0,255,0,0.15);
}

/* SKY (THERE) */
.sky{
    position:absolute;
    top:0;
    width:100%;
    height:60%;
    background:rgba(255,0,0,0.10);
}

/* LABELS */
.here-label{
    position:absolute;
    bottom:10px;
    left:10px;
    background:white;
    border:3px solid green;
    color:green;
    padding:6px 12px;
    font-weight:bold;
    border-radius:8px;
}

.there-label{
    position:absolute;
    top:10px;
    right:10px;
    background:white;
    border:3px solid red;
    color:red;
    padding:6px 12px;
    font-weight:bold;
    border-radius:8px;
}

/* OBJECT */
.object{
    position:absolute;
    font-size:90px;
    text-shadow:2px 2px 5px rgba(0,0,0,0.3);
}

/* BUTTONS */
button{
    width:90%;
    padding:14px;
    margin:8px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#1976d2;
    color:white;
    font-weight:bold;
}

/* RESULT */
#result{
    font-size:20px;
    margin-top:10px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>📍 HERE (Near) vs THERE (Far)</h1>

<div id="score">Score: 0</div>

<div class="scene" id="scene"></div>

<div id="options"></div>

<div id="result"></div>

</div>

<script>

const questions = [
{ obj:"🐱", pos:"here", answer:"There is a cat here." },
{ obj:"🐶", pos:"there", answer:"There is a dog there." },
{ obj:"🐰", pos:"here", answer:"There is a rabbit here." },
{ obj:"🦊", pos:"there", answer:"There is a fox there." }
];

const choices = [
"There is a cat here.",
"There is a dog there.",
"There is a rabbit here.",
"There is a fox there."
];

let i = 0;
let score = 0;

function load(){

if(i >= questions.length){
document.getElementById("scene").innerHTML =
"🎉 Finished! Score: " + score;
document.getElementById("options").innerHTML = "";
return;
}

let q = questions[i];

document.getElementById("scene").innerHTML = `
<div class="sky"></div>
<div class="ground"></div>

<div class="here-label">HERE (close / bottom)</div>
<div class="there-label">THERE (far / top)</div>

<div class="object" style="
    ${q.pos === 'here'
        ? 'bottom:20px; left:45%;'
        : 'top:20px; left:45%;'
    }
">
${q.obj}
</div>
`;

let html = "";

choices.forEach(c=>{
html += `<button onclick="check('${c}')">${c}</button>`;
});

document.getElementById("options").innerHTML = html;
}

function check(ans){

if(ans === questions[i].answer){
score++;
document.getElementById("result").innerHTML = "✅ Correct!";
}else{
document.getElementById("result").innerHTML =
"❌ Correct: " + questions[i].answer;
}

document.getElementById("score").innerHTML = "Score: " + score;

i++;

setTimeout(()=>{
document.getElementById("result").innerHTML = "";
load();
},1200);

}

load();

</script>

</body>
</html>
