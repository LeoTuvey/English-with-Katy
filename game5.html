<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HERE / THERE Cartoon Game</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background:linear-gradient(135deg,#84fab0,#8fd3f4);
    padding:20px;
}

.container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
}

h1{ margin-bottom:10px; }

img{
    width:100%;
    height:320px;
    object-fit:contain;
    background:#f5f5f5;
    border-radius:12px;
}

.question{
    font-size:20px;
    font-weight:bold;
    margin:15px 0;
}

button{
    width:90%;
    padding:14px;
    margin:8px;
    font-size:18px;
    border:none;
    border-radius:10px;
    background:#4a90e2;
    color:white;
    cursor:pointer;
}

#score{ margin:10px; }

#result{ font-size:20px; margin-top:10px; }
</style>
</head>

<body>

<div class="container">

<h1>🐱 HERE / THERE (Cartoon Animals)</h1>

<div id="score">Score: 0</div>

<img id="img">

<div class="question" id="question"></div>

<div id="options"></div>

<div id="result"></div>

</div>

<script>

const questions = [
{
img:"https://cdn-icons-png.flaticon.com/512/616/616408.png", // cat cartoon
text:"A cat is close to you.",
q:"Is it HERE or THERE?",
a:"HERE"
},
{
img:"https://cdn-icons-png.flaticon.com/512/616/616430.png", // rabbit cartoon
text:"A rabbit is far in the forest.",
q:"Is it HERE or THERE?",
a:"THERE"
},
{
img:"https://cdn-icons-png.flaticon.com/512/616/616430.png", // dog cartoon
text:"A dog is playing next to you.",
q:"Is it HERE or THERE?",
a:"HERE"
},
{
img:"https://cdn-icons-png.flaticon.com/512/616/616408.png", // fox/cartoon style cat placeholder
text:"A fox is far away.",
q:"Is it HERE or THERE?",
a:"THERE"
}
];

let i=0;
let score=0;

function load(){

if(i>=questions.length){
document.getElementById("question").innerHTML=
"🎉 Finished! Score: "+score;

document.getElementById("img").style.display="none";
document.getElementById("options").innerHTML="";
return;
}

document.getElementById("img").src=questions[i].img;
document.getElementById("question").innerHTML=
questions[i].text + "<br><b>"+questions[i].q+"</b>";

let html="";
["HERE","THERE"].forEach(o=>{
html+=`<button onclick="check('${o}')">${o}</button>`;
});

document.getElementById("options").innerHTML=html;
}

function check(ans){

if(ans===questions[i].a){
score++;
document.getElementById("result").innerHTML="✅ Correct!";
}else{
document.getElementById("result").innerHTML="❌ Wrong!";
}

document.getElementById("score").innerHTML="Score: "+score;

i++;

setTimeout(()=>{
document.getElementById("result").innerHTML="";
load();
},1200);

}

load();

</script>

</body>
</html>
