<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>There is / There are - Distance Game</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background:linear-gradient(135deg,#84fab0,#8fd3f4);
    padding:20px;
}

.container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
}

h1{
    margin-bottom:10px;
}

/* VISUAL AREA */
.scene{
    position:relative;
    height:260px;
    margin:20px 0;
    border-radius:12px;
    background:linear-gradient(to top, #c2f0c2 40%, #87ceeb 60%);
}

/* HERE ZONE */
.here{
    position:absolute;
    bottom:20px;
    left:20px;
    width:120px;
    height:120px;
    border-radius:50%;
    background:rgba(0,255,0,0.2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    border:2px solid green;
}

/* THERE ZONE */
.there{
    position:absolute;
    top:20px;
    right:20px;
    width:70px;
    height:70px;
    border-radius:50%;
    background:rgba(255,0,0,0.2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    border:2px solid red;
}

/* OBJECT */
.object{
    font-size:50px;
}

button{
    width:90%;
    padding:14px;
    margin:8px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#4a90e2;
    color:white;
}

#score{
    margin:10px;
}

#result{
    font-size:20px;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>📍 HERE vs THERE (Distance Game)</h1>

<div id="score">Score: 0</div>

<div class="scene" id="scene"></div>

<div id="options"></div>

<div id="result"></div>

</div>

<script>

const questions = [
{
object:"🐱",
position:"here",
answer:"There is a cat here."
},
{
object:"🐶",
position:"there",
answer:"There is a dog there."
},
{
object:"🐰",
position:"here",
answer:"There is a rabbit here."
},
{
object:"🦊",
position:"there",
answer:"There is a fox there."
}
];

const choices = [
"There is a cat here.",
"There is a dog there.",
"There is a rabbit here.",
"There is a fox there."
];

let i = 0;
let score = 0;

function load(){

if(i >= questions.length){
document.getElementById("scene").innerHTML =
"🎉 Game Finished! Score: " + score;
document.getElementById("options").innerHTML = "";
return;
}

let q = questions[i];

document.getElementById("scene").innerHTML = `
<div class="here">YOU ARE HERE</div>
<div class="there">THERE</div>
<div class="object" style="
    position:absolute;
    ${q.position === "here" ? "bottom:40px; left:80px;" : "top:40px; right:60px;"}
">
${q.object}
</div>
`;

let html = "";

choices.forEach(c=>{
html += `<button onclick="check('${c}')">${c}</button>`;
});

document.getElementById("options").innerHTML = html;
}

function check(ans){

if(ans === questions[i].answer){
score++;
document.getElementById("result").innerHTML = "✅ Correct!";
}else{
document.getElementById("result").innerHTML =
"❌ Correct answer: " + questions[i].answer;
}

document.getElementById("score").innerHTML = "Score: " + score;

i++;

setTimeout(()=>{
document.getElementById("result").innerHTML = "";
load();
},1200);

}

load();

</script>

</body>
</html>
