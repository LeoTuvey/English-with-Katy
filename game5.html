<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HERE / THERE - Matching Game</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background:linear-gradient(135deg,#84fab0,#8fd3f4);
    padding:20px;
}

.container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 12px rgba(0,0,0,0.2);
}

h1{ margin-bottom:10px; }

#score{ font-size:18px; margin:10px; }

img{
    width:100%;
    height:320px;
    object-fit:cover;
    border-radius:12px;
}

.question{
    font-size:20px;
    font-weight:bold;
    margin:15px 0;
}

button{
    width:90%;
    padding:14px;
    margin:8px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#4a90e2;
    color:white;
}

button:hover{ opacity:0.9; }

#result{
    font-size:20px;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>📍 HERE / THERE Animals</h1>

<div id="score">Score: 0</div>

<img id="img">

<div class="question" id="question"></div>

<div id="options"></div>

<div id="result"></div>

</div>

<script>

const questions = [
{
img:"https://images.unsplash.com/photo-1546182990-dffeafbe841d", // FOX
text:"A fox is in a forest far away.",
q:"Is the fox HERE or THERE?",
a:"THERE"
},
{
img:"https://images.unsplash.com/photo-1526336024174-e58f5cdd8e13", // RABBIT
text:"A rabbit is near me in the garden.",
q:"Is the rabbit HERE or THERE?",
a:"HERE"
},
{
img:"https://images.unsplash.com/photo-1517841905240-472988babdf9", // DOG
text:"A dog is playing next to me.",
q:"Is the dog HERE or THERE?",
a:"HERE"
},
{
img:"https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba", // CAT
text:"A cat is far away on a tree.",
q:"Is the cat HERE or THERE?",
a:"THERE"
},
{
img:"https://images.unsplash.com/photo-1507149833265-60c372daea22", // RABBIT
text:"A rabbit is running in the forest far away.",
q:"Is the rabbit HERE or THERE?",
a:"THERE"
}
];

let i = 0;
let score = 0;

function load(){

if(i >= questions.length){
document.getElementById("question").innerHTML =
"🎉 Finished! Score: " + score + "/" + questions.length;

document.getElementById("img").style.display = "none";
document.getElementById("options").innerHTML = "";
return;
}

document.getElementById("img").src = questions[i].img;

document.getElementById("question").innerHTML =
questions[i].text + "<br><b>" + questions[i].q + "</b>";

let html = "";

["HERE","THERE"].forEach(opt=>{
html += `<button onclick="check('${opt}')">${opt}</button>`;
});

document.getElementById("options").innerHTML = html;
}

function check(ans){

if(ans === questions[i].a){
score++;
document.getElementById("result").innerHTML = "✅ Correct!";
}else{
document.getElementById("result").innerHTML =
"❌ Wrong! Correct answer: " + questions[i].a;
}

document.getElementById("score").innerHTML =
"Score: " + score;

i++;

setTimeout(()=>{
document.getElementById("result").innerHTML = "";
load();
},1200);

}

load();

</script>

</body>
</html>
