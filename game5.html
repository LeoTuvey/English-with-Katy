<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HERE vs THERE - Clear Learning</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background:#e8f7ff;
    padding:20px;
}

.container{
    max-width:850px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
}

/* TITLE */
h1{
    margin-bottom:10px;
}

/* SCORE */
#score{
    font-size:18px;
    font-weight:bold;
    margin:10px;
}

/* SCENE */
.scene{
    position:relative;
    height:320px;
    margin:20px 0;
    border-radius:15px;
    border:3px solid #333;
    background:linear-gradient(to right, #b9f6ca 0%, #b9f6ca 45%, #ffcdd2 55%, #ffcdd2 100%);
}

/* CENTER LINE */
.line{
    position:absolute;
    left:50%;
    top:0;
    width:3px;
    height:100%;
    background:white;
}

/* HERE LABEL (BIG) */
.here-label{
    position:absolute;
    left:10px;
    top:10px;
    background:white;
    border:3px solid green;
    color:green;
    padding:6px 12px;
    font-weight:bold;
    border-radius:8px;
    font-size:20px;
}

/* THERE LABEL (SMALLER) */
.there-label{
    position:absolute;
    right:10px;
    top:10px;
    background:white;
    border:3px solid red;
    color:red;
    padding:4px 8px;
    font-weight:bold;
    border-radius:8px;
    font-size:14px;
}

/* OBJECTS */
.object{
    position:absolute;
    text-shadow:2px 2px 5px rgba(0,0,0,0.3);
}

/* HERE OBJECT (BIGGER) */
.big{
    font-size:95px;
}

/* THERE OBJECT (SMALLER) */
.small{
    font-size:55px;
    opacity:0.85;
}

/* CAN FIX (CLEARER) */
.can{
    font-size:85px;
}

/* BUTTONS */
button{
    width:90%;
    padding:14px;
    margin:8px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#1976d2;
    color:white;
    font-weight:bold;
}

/* RESULT */
#result{
    font-size:20px;
    margin-top:10px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>📍 HERE vs THERE (Clear Visual Learning)</h1>

<div id="score">Score: 0</div>

<div class="scene" id="scene"></div>

<div id="options"></div>

<div id="result"></div>

</div>

<script>

const questions = [
{ obj:"🥫", type:"can", pos:"here", answer:"There is a can here." },
{ obj:"🐱", type:"animal", pos:"there", answer:"There is a cat there." },
{ obj:"🐶", type:"animal", pos:"here", answer:"There is a dog here." },
{ obj:"🐰", type:"animal", pos:"there", answer:"There is a rabbit there." }
];

const choices = [
"There is a can here.",
"There is a cat there.",
"There is a dog here.",
"There is a rabbit there."
];

let i = 0;
let score = 0;

function load(){

if(i >= questions.length){
document.getElementById("scene").innerHTML =
"🎉 Finished! Score: " + score;
document.getElementById("options").innerHTML = "";
return;
}

let q = questions[i];

let sizeClass = "";
if(q.pos === "here") sizeClass = "big";
else sizeClass = "small";

if(q.type === "can") sizeClass = "can";

document.getElementById("scene").innerHTML = `
<div class="here-label">HERE (close)</div>
<div class="there-label">THERE (far)</div>
<div class="line"></div>

<div class="object ${sizeClass}" style="
    ${q.pos === 'here'
        ? 'left:20%; bottom:40px;'
        : 'left:75%; top:60px;'
    }
">
${q.obj}
</div>
`;

let html = "";

choices.forEach(c=>{
html += `<button onclick="check('${c}')">${c}</button>`;
});

document.getElementById("options").innerHTML = html;
}

function check(ans){

if(ans === questions[i].answer){
score++;
document.getElementById("result").innerHTML = "✅ Correct!";
}else{
document.getElementById("result").innerHTML =
"❌ Correct: " + questions[i].answer;
}

document.getElementById("score").innerHTML = "Score: " + score;

i++;

setTimeout(()=>{
document.getElementById("result").innerHTML = "";
load();
},1200);

}

load();

</script>

</body>
</html>
