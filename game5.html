<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HERE vs THERE - Clear Game</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background:#eaf6ff;
    padding:20px;
}

.container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
}

/* TITLE */
h1{
    margin-bottom:10px;
}

/* SCORE */
#score{
    font-size:18px;
    margin:10px;
    font-weight:bold;
}

/* BIG SCENE */
.scene{
    position:relative;
    height:300px;
    margin:20px 0;
    border-radius:15px;
    background:linear-gradient(to top, #b7e4c7 40%, #90caf9 60%);
    border:3px solid #333;
}

/* HERE SIDE */
.here-zone{
    position:absolute;
    bottom:0;
    left:0;
    width:50%;
    height:100%;
    background:rgba(0,255,0,0.15);
    border-right:3px dashed green;
}

/* THERE SIDE */
.there-zone{
    position:absolute;
    bottom:0;
    right:0;
    width:50%;
    height:100%;
    background:rgba(255,0,0,0.15);
    border-left:3px dashed red;
}

/* LABELS */
.label{
    position:absolute;
    top:10px;
    font-size:24px;
    font-weight:bold;
    padding:6px 12px;
    border-radius:8px;
    background:white;
}

.here-label{
    left:10px;
    color:green;
    border:2px solid green;
}

.there-label{
    right:10px;
    color:red;
    border:2px solid red;
}

/* OBJECT */
.object{
    font-size:80px;
    position:absolute;
    text-shadow:2px 2px 4px rgba(0,0,0,0.3);
}

/* BUTTONS */
button{
    width:90%;
    padding:14px;
    margin:8px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#1e88e5;
    color:white;
    font-weight:bold;
}

button:hover{
    opacity:0.9;
}

/* RESULT */
#result{
    font-size:20px;
    margin-top:10px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>📍 HERE vs THERE (Clear Distance)</h1>

<div id="score">Score: 0</div>

<div class="scene" id="scene"></div>

<div id="options"></div>

<div id="result"></div>

</div>

<script>

const questions = [
{ animal:"🐱", pos:"here", answer:"There is a cat here." },
{ animal:"🐶", pos:"there", answer:"There is a dog there." },
{ animal:"🐰", pos:"here", answer:"There is a rabbit here." },
{ animal:"🦊", pos:"there", answer:"There is a fox there." }
];

const choices = [
"There is a cat here.",
"There is a dog there.",
"There is a rabbit here.",
"There is a fox there."
];

let i = 0;
let score = 0;

function load(){

if(i >= questions.length){
document.getElementById("scene").innerHTML =
"🎉 Finished! Score: " + score;
document.getElementById("options").innerHTML = "";
return;
}

let q = questions[i];

document.getElementById("scene").innerHTML = `
<div class="here-zone">
<div class="label here-label">HERE (close)</div>
</div>

<div class="there-zone">
<div class="label there-label">THERE (far)</div>
</div>

<div class="object" style="
    ${q.pos === 'here'
        ? 'bottom:30px; left:25%;'
        : 'top:30px; right:25%;'
    }
">
${q.animal}
</div>
`;

let html = "";

choices.forEach(c=>{
html += `<button onclick="check('${c}')">${c}</button>`;
});

document.getElementById("options").innerHTML = html;
}

function check(ans){

if(ans === questions[i].answer){
score++;
document.getElementById("result").innerHTML = "✅ Correct!";
}else{
document.getElementById("result").innerHTML =
"❌ Correct: " + questions[i].answer;
}

document.getElementById("score").innerHTML = "Score: " + score;

i++;

setTimeout(()=>{
document.getElementById("result").innerHTML = "";
load();
},1200);

}

load();

</script>

</body>
</html>
