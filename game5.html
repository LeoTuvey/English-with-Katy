<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>There Is / There Are (Here / There)</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background:linear-gradient(135deg,#84fab0,#8fd3f4);
    padding:20px;
}

.container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 12px rgba(0,0,0,0.2);
}

h1{ margin-bottom:10px; }

#score{ margin:10px; font-size:18px; }

.scene img{
    width:100%;
    height:320px;
    object-fit:cover;
    border-radius:12px;
}

.label{
    font-size:20px;
    margin:10px;
    font-weight:bold;
}

button{
    width:90%;
    padding:14px;
    margin:8px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#4a90e2;
    color:white;
}

button:hover{ opacity:0.9; }

#result{
    font-size:20px;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>📍 There Is / There Are</h1>

<div id="score">Score: 0</div>

<div class="scene">
    <img id="img" src="">
</div>

<div class="label" id="question"></div>

<div id="options"></div>

<div id="result"></div>

</div>

<script>

const questions = [
{
img:"https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba",
question:"The cat is HERE 🏠 or THERE 🌳?",
answer:"HERE"
},
{
img:"https://images.unsplash.com/photo-1507149833265-60c372daea22",
question:"The rabbit is HERE 🏠 or THERE 🌳?",
answer:"THERE"
},
{
img:"https://images.unsplash.com/photo-1517841905240-472988babdf9",
question:"The dog is HERE 🏠 or THERE 🌳?",
answer:"HERE"
},
{
img:"https://images.unsplash.com/photo-1546182990-dffeafbe841d",
question:"The fox is HERE 🏠 or THERE 🌳?",
answer:"THERE"
}
];

let current = 0;
let score = 0;

function load(){

if(current >= questions.length){
document.getElementById("question").innerHTML =
"🎉 Finished! Score: " + score;
document.getElementById("img").style.display="none";
document.getElementById("options").innerHTML="";
return;
}

document.getElementById("img").src = questions[current].img;
document.getElementById("question").innerHTML = questions[current].question;

let html = "";

["HERE","THERE"].forEach(opt=>{
html += `<button onclick="check('${opt}')">${opt}</button>`;
});

document.getElementById("options").innerHTML = html;
}

function check(ans){

if(ans === questions[current].answer){
score++;
document.getElementById("result").innerHTML="✅ Correct!";
}else{
document.getElementById("result").innerHTML="❌ Wrong!";
}

document.getElementById("score").innerHTML="Score: " + score;

current++;

setTimeout(()=>{
document.getElementById("result").innerHTML="";
load();
},1200);

}

load();

</script>

</body>
</html>
