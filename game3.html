<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game 3 - This / That</title>

<style>
  body {
    font-family: Arial;
    margin: 0;
    text-align: center;
    background: linear-gradient(135deg, #e3f2fd, #fce4ec);
  }

  h1 {
    margin-top: 15px;
  }

  #scoreBox {
    font-size: 18px;
    margin: 10px;
  }

  #emoji {
    font-size: 60px;
    margin: 20px;
  }

  #text {
    font-size: 22px;
    margin: 10px;
  }

  .btn {
    padding: 12px 20px;
    margin: 8px;
    border-radius: 10px;
    border: none;
    font-size: 18px;
    cursor: pointer;
  }

  .correct {
    background: #4CAF50;
    color: white;
  }

  .wrong {
    background: #f44336;
    color: white;
  }

  #feedback {
    font-size: 20px;
    margin: 10px;
  }
</style>
</head>

<body>

<h1>📍 Game 3: This / That</h1>

<div id="scoreBox">⭐ Score: <span id="score">0</span></div>

<div id="emoji">📚</div>
<div id="text">This is a book (near)</div>

<div>
  <button class="btn correct" onclick="answer(true)">Correct</button>
  <button class="btn wrong" onclick="answer(false)">Wrong</button>
</div>

<div id="feedback"></div>

<button class="btn" onclick="next()">➡️ Next</button>

<script>

// 🧠 SAVE SYSTEM
function saveScore(gameId, score) {
  localStorage.setItem(gameId + "_score", score);
}

function loadScore(gameId) {
  return parseInt(localStorage.getItem(gameId + "_score")) || 0;
}

// 🎯 GAME ID
let gameId = "game3";

// 📊 SCORE
let score = loadScore(gameId);
document.getElementById("score").innerText = score;

// 🎮 QUESTIONS
const questions = [
  { emoji: "📚", text: "This is a book (near)", correct: true },
  { emoji: "🚗", text: "That is a car (far)", correct: true },
  { emoji: "🐶", text: "This is a dog (far away)", correct: false },
  { emoji: "🐱", text: "That is a cat (far)", correct: true },
  { emoji: "✏️", text: "This is a pencil (near)", correct: true },
  { emoji: "🏠", text: "This is a house (far away)", correct: false }
];

let index = 0;

// 🔄 LOAD QUESTION
function loadQuestion() {
  document.getElementById("emoji").innerText = questions[index].emoji;
  document.getElementById("text").innerText = questions[index].text;
  document.getElementById("feedback").innerText = "";
}

// ✅ ANSWER
function answer(userAnswer) {
  if (userAnswer === questions[index].correct) {
    score += 10;
    saveScore(gameId, score);

    document.getElementById("score").innerText = score;
    document.getElementById("feedback").innerText = "✅ Correct!";
  } else {
    document.getElementById("feedback").innerText = "❌ Try again!";
  }
}

// ➡️ NEXT
function next() {
  index++;
  if (index >= questions.length) {
    index = 0;
    alert("🎉 Game 3 Finished! Score: " + score);
  }
  loadQuestion();
}

loadQuestion();

</script>

</body>
</html>
