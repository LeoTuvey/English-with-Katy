<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game 3 - This / That / These / Those</title>

<style>
  body {
    font-family: Arial;
    background: linear-gradient(135deg, #e3f2fd, #fce4ec);
    text-align: center;
    margin: 0;
  }

  h1 {
    color: #2c3e50;
    margin-top: 10px;
  }

  #topBar {
    display: flex;
    justify-content: space-around;
    margin: 10px;
  }

  .box {
    background: white;
    padding: 10px 15px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }

  #question {
    font-size: 80px;
    margin: 30px;
    transition: 0.3s;
  }

  .near {
    transform: scale(1.3);
    opacity: 1;
  }

  .far {
    transform: scale(0.6);
    opacity: 0.4;
  }

  .btn {
    display: inline-block;
    padding: 12px 18px;
    margin: 10px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 18px;
    color: white;
  }

  .this { background: #2196F3; }
  .that { background: #FF9800; }
  .these { background: #4CAF50; }
  .those { background: #9C27B0; }

  #feedback {
    font-size: 24px;
    margin: 10px;
  }

  .next {
    background: #333;
    color: white;
    padding: 10px 15px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 10px;
  }
</style>
</head>

<body>

<h1>📍 Game 3: This / That / These / Those</h1>

<div id="topBar">
  <div class="box">⭐ Score: <span id="score">0</span></div>
  <div class="box">📊 Level: <span id="level">1</span></div>
</div>

<div id="question"></div>

<div>
  <div class="btn this" onclick="answer('this')">This 👉</div>
  <div class="btn these" onclick="answer('these')">These 👉👉</div>
  <div class="btn that" onclick="answer('that')">That 👈</div>
  <div class="btn those" onclick="answer('those')">Those 👈👈</div>
</div>

<p id="feedback"></p>

<button class="next" onclick="next()">➡️ Next</button>

<script>

// 💾 PROGRESS SYSTEM
function saveProgress(game, score) {
  localStorage.setItem(game + "_score", score);
}

function loadProgress(game) {
  return parseInt(localStorage.getItem(game + "_score")) || 0;
}

// 🎮 GAME DATA
const game = [
  { emoji: "🐱", position: "near", type: "this" },
  { emoji: "🐱🐱", position: "near", type: "these" },
  { emoji: "🚗", position: "far", type: "that" },
  { emoji: "🚗🚗", position: "far", type: "those" },
  { emoji: "🍎", position: "near", type: "this" },
  { emoji: "🍎🍎", position: "near", type: "these" },
  { emoji: "🏠", position: "far", type: "that" },
  { emoji: "🏠🏠", position: "far", type: "those" }
];

let current = 0;

// 🔥 LOAD SCORE
let score = loadProgress("game3");
document.getElementById("score").innerText = score;

// 🔊 SPEAK
function speak(text) {
  speechSynthesis.speak(new SpeechSynthesisUtterance(text));
}

// 📥 LOAD
function load() {
  const item = game[current];

  const question = document.getElementById("question");
  question.innerText = item.emoji;

  question.classList.remove("near", "far");
  question.classList.add(item.position);

  document.getElementById("level").innerText = current + 1;
  document.getElementById("feedback").innerText = "";
}

// ✅ ANSWER
function answer(choice) {
  const correct = game[current].type;

  if (choice === correct) {
    score += 10;
    document.getElementById("score").innerText = score;

    saveProgress("game3", score);

    document.getElementById("feedback").innerText = "🎉 Correct!";
    speak("Correct");

  } else {
    document.getElementById("feedback").innerText = "😕 Try again!";
    speak("Try again");
  }
}

// ➡️ NEXT
function next() {
  current++;

  if (current >= game.length) {
    current = 0;
    alert("🎉 Finished Game 3! Score: " + score);
  }

  load();
}

load();

</script>

</body>
</html>
