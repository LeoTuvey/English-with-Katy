<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game</title>

<style>
  body {
    font-family: Arial;
    text-align: center;
    margin: 0;
    background: linear-gradient(135deg, #e3f2fd, #fce4ec);
  }

  h1 {
    margin-top: 15px;
  }

  #scoreBox {
    font-size: 18px;
    margin: 10px;
  }

  #question {
    font-size: 60px;
    margin: 20px;
  }

  #text {
    font-size: 22px;
    margin: 10px;
  }

  .btn {
    padding: 12px 20px;
    margin: 8px;
    border-radius: 10px;
    border: none;
    font-size: 18px;
    cursor: pointer;
  }

  .correct {
    background: #4CAF50;
    color: white;
  }

  .wrong {
    background: #f44336;
    color: white;
  }

  #feedback {
    font-size: 20px;
    margin: 10px;
  }
</style>
</head>

<body>

<h1>🎮 Game</h1>

<div id="scoreBox">⭐ Score: <span id="score">0</span></div>

<div id="question">🐱</div>
<div id="text">There is a cat</div>

<div>
  <button class="btn correct" onclick="answer(true)">Correct</button>
  <button class="btn wrong" onclick="answer(false)">Wrong</button>
</div>

<div id="feedback"></div>

<script>

// 🧠 STORAGE SYSTEM
function saveScore(game, score) {
  localStorage.setItem(game + "_score", score);
}

function loadScore(game) {
  return parseInt(localStorage.getItem(game + "_score")) || 0;
}

// 🎯 CHANGE THIS FOR EACH GAME
let gameId = "game1"; // change to game2, game3, game4

let score = loadScore(gameId);
document.getElementById("score").innerText = score;

// 🎮 SIMPLE QUESTIONS (YOU CAN CHANGE THIS LIST)
const questions = [
  { emoji: "🐱", text: "There is a cat", correct: true },
  { emoji: "🐶", text: "There is a dog", correct: true },
  { emoji: "🐰", text: "There is a apple", correct: false }
];

let index = 0;

function loadQuestion() {
  document.getElementById("question").innerText = questions[index].emoji;
  document.getElementById("text").innerText = questions[index].text;
  document.getElementById("feedback").innerText = "";
}

function answer(userAnswer) {
  if (userAnswer === questions[index].correct) {
    score += 10;
    saveScore(gameId, score);

    document.getElementById("score").innerText = score;
    document.getElementById("feedback").innerText = "✅ Correct!";
  } else {
    document.getElementById("feedback").innerText = "❌ Try again!";
  }
}

function next() {
  index++;
  if (index >= questions.length) {
    index = 0;
    alert("🎉 Finished! Score: " + score);
  }
  loadQuestion();
}

loadQuestion();

</script>

<br>
<button class="btn" onclick="next()">➡️ Next</button>

</body>
</html>
