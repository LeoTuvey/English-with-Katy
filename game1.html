<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game 1 - Daily Actions</title>

<style>
  body {
    font-family: Arial;
    margin: 0;
    text-align: center;
    background: linear-gradient(135deg, #e3f2fd, #fce4ec);
  }

  h1 {
    margin-top: 15px;
  }

  #scoreBox {
    font-size: 18px;
    margin: 10px;
  }

  #question {
    font-size: 60px;
    margin: 20px;
  }

  #text {
    font-size: 22px;
    margin: 10px;
  }

  .btn {
    padding: 12px 20px;
    margin: 8px;
    border-radius: 10px;
    border: none;
    font-size: 18px;
    cursor: pointer;
  }

  .correct {
    background: #4CAF50;
    color: white;
  }

  .wrong {
    background: #f44336;
    color: white;
  }

  #feedback {
    font-size: 20px;
    margin: 10px;
  }
</style>
</head>

<body>

<h1>🏃‍♂️ Game 1: Daily Actions</h1>

<div id="scoreBox">⭐ Score: <span id="score">0</span></div>

<div id="question">🏃‍♂️</div>
<div id="text">I am running</div>

<div>
  <button class="btn correct" onclick="answer(true)">Correct</button>
  <button class="btn wrong" onclick="answer(false)">Wrong</button>
</div>

<div id="feedback"></div>

<button class="btn" onclick="next()">➡️ Next</button>

<script>

// 🧠 SAVE SYSTEM
function saveScore(gameId, score) {
  localStorage.setItem(gameId + "_score", score);
}

function loadScore(gameId) {
  return parseInt(localStorage.getItem(gameId + "_score")) || 0;
}

// 🎯 GAME ID (IMPORTANT)
let gameId = "game1";

// 📊 SCORE
let score = loadScore(gameId);
document.getElementById("score").innerText = score;

// 🎮 QUESTIONS (REAL GAME 1 CONTENT)
const questions = [
  { emoji: "🏃‍♂️", text: "I am running", correct: true },
  { emoji: "🍎", text: "I am eating an apple", correct: true },
  { emoji: "😴", text: "I am sleeping", correct: true },
  { emoji: "🚗", text: "I am driving a car", correct: true },
  { emoji: "📖", text: "I am reading a book", correct: true },
  { emoji: "🐱", text: "I am eating a cat", correct: false }
];

let index = 0;

// 🔄 LOAD QUESTION
function loadQuestion() {
  document.getElementById("question").innerText = questions[index].emoji;
  document.getElementById("text").innerText = questions[index].text;
  document.getElementById("feedback").innerText = "";
}

// ✅ ANSWER
function answer(userAnswer) {
  if (userAnswer === questions[index].correct) {
    score += 10;
    saveScore(gameId, score);

    document.getElementById("score").innerText = score;
    document.getElementById("feedback").innerText = "✅ Correct!";
  } else {
    document.getElementById("feedback").innerText = "❌ Try again!";
  }
}

// ➡️ NEXT
function next() {
  index++;
  if (index >= questions.length) {
    index = 0;
    alert("🎉 Game 1 Finished! Score: " + score);
  }
  loadQuestion();
}

loadQuestion();

</script>

</body>
</html>
