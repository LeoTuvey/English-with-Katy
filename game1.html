<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game 1 - Daily Actions</title>

<style>
  body {
    font-family: Arial;
    background: linear-gradient(135deg, #e3f2fd, #fce4ec);
    text-align: center;
    margin: 0;
  }

  h1 {
    color: #2c3e50;
    margin-top: 10px;
  }

  #topBar {
    display: flex;
    justify-content: space-around;
    margin: 10px;
  }

  .box {
    background: white;
    padding: 10px 15px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }

  #question {
    font-size: 40px;
    margin: 20px;
  }

  #options {
    margin: 10px;
  }

  .option {
    display: inline-block;
    padding: 12px 16px;
    margin: 6px;
    background: #4CAF50;
    color: white;
    border-radius: 12px;
    cursor: pointer;
    font-size: 16px;
  }

  #feedback {
    font-size: 24px;
    margin: 10px;
  }

  button {
    padding: 10px 15px;
    margin: 10px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }

  .next {
    background: #FF9800;
    color: white;
  }
</style>
</head>

<body>

<h1>🏃‍♂️ Game 1: Daily Actions</h1>

<div id="topBar">
  <div class="box">⭐ Score: <span id="score">0</span></div>
  <div class="box">📊 Level: <span id="level">1</span></div>
</div>

<div id="question"></div>

<div id="options"></div>

<p id="feedback"></p>

<button class="next" onclick="next()">➡️ Next</button>

<script>

// 🧠 PROGRESS SYSTEM
function saveProgress(game, score) {
  localStorage.setItem(game + "_score", score);
}

function loadProgress(game) {
  return parseInt(localStorage.getItem(game + "_score")) || 0;
}

// 🎮 GAME DATA
const game = [
  { q: "🏃‍♂️", answer: "He is running", options: ["He is running", "He is eating", "He is sleeping"] },
  { q: "🍽️", answer: "She is eating", options: ["She is eating", "She is running", "She is reading"] },
  { q: "😴", answer: "He is sleeping", options: ["He is sleeping", "He is running", "She is eating"] },
  { q: "📖", answer: "She is reading", options: ["She is reading", "She is sleeping", "He is running"] },
  { q: "🚶‍♂️", answer: "He is walking", options: ["He is walking", "He is eating", "She is reading"] }
];

let current = 0;

// 🔥 LOAD SAVED SCORE
let score = loadProgress("game1");
document.getElementById("score").innerText = score;

function speak(text) {
  speechSynthesis.speak(new SpeechSynthesisUtterance(text));
}

function load() {
  const item = game[current];

  document.getElementById("question").innerText = item.q;
  document.getElementById("level").innerText = current + 1;

  const optionsDiv = document.getElementById("options");
  const feedback = document.getElementById("feedback");

  optionsDiv.innerHTML = "";
  feedback.innerHTML = "";

  item.options.forEach(opt => {
    const btn = document.createElement("div");
    btn.className = "option";
    btn.innerText = opt;

    btn.onclick = () => {
      check(opt);
    };

    optionsDiv.appendChild(btn);
  });
}

function check(choice) {
  const correct = game[current].answer;

  if (choice === correct) {
    score += 10;
    document.getElementById("score").innerText = score;

    saveProgress("game1", score); // 💾 SAVE PROGRESS

    document.getElementById("feedback").innerHTML = "🎉 Correct!";
    speak("Correct");

  } else {
    document.getElementById("feedback").innerHTML = "😕 Try again!";
  }
}

function next() {
  current++;

  if (current >= game.length) {
    current = 0;
    alert("🎉 Finished Game 1! Score: " + score);
  }

  load();
}

load();

</script>

</body>
</html>
