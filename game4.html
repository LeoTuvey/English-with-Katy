<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Run After / Run From Game</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background:#f7fbff;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
}

h1{
    margin-bottom:10px;
}

.scene{
    height:260px;
    border:3px solid #333;
    border-radius:15px;
    position:relative;
    background:linear-gradient(to top,#d0f5c8 40%,#cfe8ff 40%);
    margin-bottom:20px;
}

.character{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    font-size:130px;
}

.enemy{
    position:absolute;
    top:20px;
    right:10%;
    font-size:120px;
}

.questionBox{
    font-size:22px;
    font-weight:bold;
    margin:10px;
}

button{
    width:95%;
    padding:14px;
    margin:8px;
    font-size:18px;
    border:none;
    border-radius:10px;
    background:#1976d2;
    color:white;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

#result{
    font-size:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>🐾 Run After / Run From Game</h1>

<div class="scene" id="scene"></div>

<div class="questionBox" id="question"></div>

<div id="options"></div>

<div id="result"></div>

</div>

<script>

/* 🔊 KID-CLEAR VOICE SYSTEM (helper) */
function speak(text){

    let msg = new SpeechSynthesisUtterance(text);

    msg.lang = "en-US";
    msg.rate = 0.78;
    msg.pitch = 1.25;
    msg.volume = 1;

    let voices = speechSynthesis.getVoices();

    let voice =
        voices.find(v => v.name.includes("Google UK English Female")) ||
        voices.find(v => v.name.includes("Microsoft Zira")) ||
        voices.find(v => v.name.includes("Samantha")) ||
        voices.find(v => v.lang.includes("en-US")) ||
        voices[0];

    if(voice){
        msg.voice = voice;
    }

    speechSynthesis.speak(msg);
}

/* GAME DATA (UNCHANGED) */
const questions = [

{
character:"🐶",
enemy:"🐱",
question:"What should the dog do?",
answers:[
"Run after the cat",
"Run from the cat"
],
correct:0
},

{
character:"🐰",
enemy:"🦊",
question:"What should the rabbit do?",
answers:[
"Run from the fox",
"Run after the fox"
],
correct:0
},

{
character:"🐭",
enemy:"🐱",
question:"What should the mouse do?",
answers:[
"Run from the cat",
"Run after the cat"
],
correct:0
}

];

let i = 0;

/* LOAD GAME */
function load(){

if(i >= questions.length){

speechSynthesis.cancel();
speak("Great job! You finished Game Four!");

document.getElementById("scene").innerHTML = "🎉 Finished!";
document.getElementById("question").innerHTML = "";
document.getElementById("options").innerHTML = "";
return;
}

let q = questions[i];

/* clear old speech */
speechSynthesis.cancel();

/* show visuals */
document.getElementById("scene").innerHTML = `
<div class="character">${q.character}</div>
<div class="enemy">${q.enemy}</div>
`;

document.getElementById("question").innerHTML = q.question;

let html = "";

q.answers.forEach((a, index) => {
html += `<button onclick="check(${index}, '${a}')">${a}</button>`;
});

document.getElementById("options").innerHTML = html;

/* 🔊 FIXED VOICE FLOW */
let explanation = "";

if(q.question.includes("Run after")){
explanation = "Run after means chase.";
}

if(q.question.includes("Run from")){
explanation = "Run from means escape.";
}

let qMsg = new SpeechSynthesisUtterance(q.question);
qMsg.lang = "en-US";
qMsg.rate = 0.78;
qMsg.pitch = 1.25;

qMsg.onend = () => {

if(explanation !== ""){
let eMsg = new SpeechSynthesisUtterance(explanation);
eMsg.lang = "en-US";
eMsg.rate = 0.78;
eMsg.pitch = 1.25;
speechSynthesis.speak(eMsg);
}

};

speechSynthesis.speak(qMsg);

}

/* CHECK ANSWER */
function check(ans, text){

speak(text);

if(ans === questions[i].correct){
document.getElementById("result").innerHTML = "✅ Correct!";
speak("Correct!");
}else{
document.getElementById("result").innerHTML = "❌ Try again!";
speak("Try again!");
}

i++;

setTimeout(()=>{
document.getElementById("result").innerHTML = "";
load();
},1200);

}

load();

</script>

</body>
</html>
