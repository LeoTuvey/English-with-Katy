<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>English with Katy - App</title>

<style>
  body {
    font-family: Arial;
    margin: 0;
    background: linear-gradient(135deg, #e3f2fd, #fce4ec);
    text-align: center;
  }

  h1 {
    margin-top: 20px;
    color: #2c3e50;
  }

  .subtitle {
    color: #555;
    margin-bottom: 20px;
  }

  #container {
    width: 90%;
    max-width: 500px;
    margin: auto;
  }

  .section-title {
    text-align: left;
    margin: 15px 5px;
    font-weight: bold;
    color: #444;
  }

  .game {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: white;
    padding: 15px;
    margin: 10px 0;
    border-radius: 15px;
    text-decoration: none;
    color: black;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
  }

  .left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .emoji {
    font-size: 30px;
  }

  .status {
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 10px;
    background: #eee;
    min-width: 90px;
    text-align: center;
  }

  /* 🔧 DEBUG BOX */
  #debug {
    margin: 20px auto;
    padding: 10px;
    background: #fff3cd;
    border: 1px solid #ffeeba;
    width: 90%;
    max-width: 500px;
    border-radius: 10px;
    font-size: 14px;
  }
</style>
</head>

<body>

<h1>📚 English with Katy</h1>
<p class="subtitle">Progress Debug Version 🔧</p>

<div id="container">

  <div class="section-title">🟢 Beginner Games</div>

  <div class="game">
    <div class="left">
      <div class="emoji">🏃‍♂️</div>
      <div>Game 1</div>
    </div>
    <div class="status" id="g1">Loading...</div>
  </div>

  <div class="game">
    <div class="left">
      <div class="emoji">✔️❌</div>
      <div>Game 2</div>
    </div>
    <div class="status" id="g2">Loading...</div>
  </div>

  <div class="game">
    <div class="left">
      <div class="emoji">📍</div>
      <div>Game 3</div>
    </div>
    <div class="status" id="g3">Loading...</div>
  </div>

  <div class="game">
    <div class="left">
      <div class="emoji">⭐</div>
      <div>Game 4</div>
    </div>
    <div class="status" id="g4">Loading...</div>
  </div>

</div>

<!-- 🔧 DEBUG INFO -->
<div id="debug">
  <b>Debug Info:</b><br>
  Game1 Score: <span id="d1"></span><br>
  Game2 Score: <span id="d2"></span><br>
  Game3 Score: <span id="d3"></span><br>
  Game4 Score: <span id="d4"></span>
</div>

<script>

// 📊 GET SCORE
function getScore(game) {
  return parseInt(localStorage.getItem(game + "_score")) || 0;
}

// ⭐ STARS
function stars(score) {
  if (score >= 80) return "⭐⭐⭐ Done";
  if (score >= 50) return "⭐⭐ Good";
  if (score >= 20) return "⭐ Started";
  return "Play";
}

// 🔄 UPDATE UI
function update() {

  // games
  const games = ["game1", "game2", "game3", "game4"];

  games.forEach((g, i) => {
    const score = getScore(g);

    document.getElementById("g" + (i + 1)).innerText = stars(score);

    // debug
    document.getElementById("d" + (i + 1)).innerText = score;
  });

}

update();

</script>

</body>
</html>
