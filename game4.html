<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Run After / Run From Game</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background:#f7fbff;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
}

h1{
    margin-bottom:10px;
}

.scene{
    height:300px;
    border:3px solid #333;
    border-radius:15px;
    position:relative;
    background:linear-gradient(to top,#d0f5c8 40%,#cfe8ff 40%);
    overflow:hidden;
}

/* 🐾 SLOW MOVEMENT */
.move-slow{
    position:absolute;
    left:10%;
    bottom:40px;
    width:120px;
    animation:runSlow 4s forwards;
}

@keyframes runSlow{
    0%{left:10%}
    100%{left:60%}
}

.static{
    position:absolute;
    top:40px;
    right:20%;
    width:120px;
}

/* speech bubble */
.bubble{
    position:absolute;
    top:10px;
    left:10px;
    background:white;
    border:2px solid #333;
    padding:10px;
    border-radius:10px;
    font-weight:bold;
    font-size:18px;
}

button{
    width:95%;
    padding:14px;
    margin:8px;
    font-size:18px;
    border:none;
    border-radius:10px;
    background:#1976d2;
    color:white;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

#result{
    font-size:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>🐾 Run After / Run From</h1>

<div class="scene" id="scene"></div>

<div id="options"></div>

<div id="result"></div>

</div>

<script>

/* VOICE */
function speak(text){
    let msg = new SpeechSynthesisUtterance(text);
    msg.lang = "en-US";
    msg.rate = 0.78;
    msg.pitch = 1.25;

    let voices = speechSynthesis.getVoices();
    let voice =
        voices.find(v => v.name.includes("Google UK English Female")) ||
        voices.find(v => v.name.includes("Microsoft Zira")) ||
        voices.find(v => v.name.includes("Samantha")) ||
        voices[0];

    if(voice) msg.voice = voice;

    speechSynthesis.speak(msg);
}

/* 🖼️ IMAGE VERSION */
const questions = [

{
run:"dog.png",
chase:"cat.png",
question:"What is happening?",
answers:["Run after","Run from"],
correct:0
},

{
run:"cat.png",
chase:"mouse.png",
question:"What is happening?",
answers:["Run after","Run from"],
correct:0
},

{
run:"fox.png",
chase:"rabbit.png",
question:"What is happening?",
answers:["Run after","Run from"],
correct:0
}

];

let i = 0;

function load(){

if(i >= questions.length){
speak("Great job!");
document.getElementById("scene").innerHTML = "🎉 Finished!";
document.getElementById("options").innerHTML = "";
return;
}

let q = questions[i];

speechSynthesis.cancel();

/* 🖼️ SCENE */
document.getElementById("scene").innerHTML = `
<div class="bubble">What is happening?</div>

<img class="move-slow" src="images/${q.run}">
<img class="static" src="images/${q.chase}">
`;

/* VOICE */
setTimeout(()=> speak(q.question), 400);

/* OPTIONS */
let html = "";
q.answers.forEach((a, index)=>{
html += `<button onclick="check(${index})">${a}</button>`;
});

document.getElementById("options").innerHTML = html;

}

function check(ans){

if(ans === questions[i].correct){
document.getElementById("result").innerHTML = "✅ Correct!";
speak("Correct!");
}else{
document.getElementById("result").innerHTML = "❌ Try again!";
speak("Try again!");
}

i++;

setTimeout(()=>{
document.getElementById("result").innerHTML = "";
load();
},1500);

}

load();

</script>

</body>
</html>
