<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Run After / Run From</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background:linear-gradient(135deg,#f6d365,#fda085);
    padding:20px;
}

.container{
    max-width:750px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 12px rgba(0,0,0,0.2);
}

h1{
    margin-bottom:10px;
}

#imageBox img{
    width:100%;
    max-height:300px;
    object-fit:cover;
    border-radius:12px;
    margin:15px 0;
}

#question{
    font-size:20px;
    margin:20px 0;
}

button{
    padding:14px;
    margin:8px;
    width:90%;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#4a90e2;
    color:white;
}

button:hover{
    opacity:0.9;
}

#score{
    font-size:18px;
    margin:10px;
}

#result{
    font-size:20px;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<h1>🏃 Run After / Run From</h1>

<div id="score">Score: 0</div>

<div id="imageBox"></div>

<div id="question"></div>

<div id="options"></div>

<div id="result"></div>

</div>

<script>

const questions = [
{
img:"https://images.unsplash.com/photo-1502086223501-7ea6ecd79368",
q:"The fox is chasing the rabbit. What is the fox doing?",
answer:"runs after"
},
{
img:"https://images.unsplash.com/photo-1552410260-0fd9b3a6b1e0",
q:"The rabbit is trying to escape. What is it doing?",
answer:"runs from"
},
{
img:"https://images.unsplash.com/photo-1546182990-dffeafbe841d",
q:"The dog is following the cat. What is the dog doing?",
answer:"runs after"
},
{
img:"https://images.unsplash.com/photo-1518791841217-8f162f1e1131",
q:"The cat is escaping from the dog. What is the cat doing?",
answer:"runs from"
}
];

let current = 0;
let score = 0;

function loadQuestion(){

if(current >= questions.length){
    document.getElementById("imageBox").innerHTML = "";
    document.getElementById("question").innerHTML =
    "🎉 Game Over!";
    
    document.getElementById("options").innerHTML = "";
    
    document.getElementById("result").innerHTML =
    "Final Score: " + score + "/" + questions.length;
    
    return;
}

document.getElementById("imageBox").innerHTML =
`<img src="${questions[current].img}">`;

document.getElementById("question").innerHTML =
questions[current].q;

let options = ["runs after","runs from"];

let html = "";

options.forEach(opt=>{
    html += `<button onclick="check('${opt}')">${opt}</button>`;
});

document.getElementById("options").innerHTML = html;

}

function check(answer){

if(answer === questions[current].answer){
    score++;
    document.getElementById("result").innerHTML = "✅ Correct!";
}else{
    document.getElementById("result").innerHTML =
    "❌ Wrong! Correct answer: " + questions[current].answer;
}

document.getElementById("score").innerHTML =
"Score: " + score;

current++;

setTimeout(()=>{
    document.getElementById("result").innerHTML = "";
    loadQuestion();
},1200);

}

loadQuestion();

</script>

</body>
</html>
