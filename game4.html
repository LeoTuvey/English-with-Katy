<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Run After / Run From Game</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background:#f7fbff;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
}

h1{
    margin-bottom:10px;
}

.scene{
    height:260px;
    border:3px solid #333;
    border-radius:15px;
    position:relative;
    background:linear-gradient(to top,#d0f5c8 40%,#cfe8ff 40%);
    margin-bottom:20px;
    overflow:hidden;
}

/* MOVING ANIMATIONS */
.move-right{
    position:absolute;
    left:10%;
    bottom:40px;
    font-size:120px;
    animation:runRight 2s forwards;
}

@keyframes runRight{
    0%{left:10%}
    100%{left:70%}
}

.static{
    position:absolute;
    top:40px;
    right:20%;
    font-size:120px;
}

/* speech bubble */
.bubble{
    position:absolute;
    top:10px;
    left:10px;
    background:white;
    border:2px solid #333;
    padding:10px;
    border-radius:10px;
    font-weight:bold;
}

button{
    width:95%;
    padding:14px;
    margin:8px;
    font-size:18px;
    border:none;
    border-radius:10px;
    background:#1976d2;
    color:white;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

#result{
    font-size:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>🐾 Run After / Run From</h1>

<div class="scene" id="scene"></div>

<div id="options"></div>

<div id="result"></div>

</div>

<script>

/* VOICE */
function speak(text){
    let msg = new SpeechSynthesisUtterance(text);
    msg.lang = "en-US";
    msg.rate = 0.78;
    msg.pitch = 1.25;

    let voices = speechSynthesis.getVoices();
    let voice =
        voices.find(v => v.name.includes("Google UK English Female")) ||
        voices.find(v => v.name.includes("Microsoft Zira")) ||
        voices.find(v => v.name.includes("Samantha")) ||
        voices[0];

    if(voice) msg.voice = voice;

    speechSynthesis.speak(msg);
}

const questions = [

{
moving:"🐶➡️🐱",
actor:"🐱",
question:"What am I doing?",
answers:["Run after","Run from"],
correct:0
},

{
moving:"🐱➡️🐭",
actor:"🐭",
question:"What am I doing?",
answers:["Run after","Run from"],
correct:1
},

{
moving:"🦊➡️🐰",
actor:"🐰",
question:"What am I doing?",
answers:["Run after","Run from"],
correct:1
}

];

let i = 0;

function load(){

if(i >= questions.length){
speak("Great job!");
document.getElementById("scene").innerHTML = "🎉 Finished!";
document.getElementById("options").innerHTML = "";
return;
}

let q = questions[i];

speechSynthesis.cancel();

/* SCENE */
document.getElementById("scene").innerHTML = `
<div class="bubble">${q.actor} says: ${q.question}</div>
<div class="move-right">${q.moving}</div>
`;

/* VOICE */
setTimeout(()=> speak(q.question), 400);

/* OPTIONS */
let html = "";
q.answers.forEach((a, index)=>{
html += `<button onclick="check(${index})">${a}</button>`;
});

document.getElementById("options").innerHTML = html;

}

function check(ans){

if(ans === questions[i].correct){
document.getElementById("result").innerHTML = "✅ Correct!";
speak("Correct!");
}else{
document.getElementById("result").innerHTML = "❌ Try again!";
speak("Try again!");
}

i++;

setTimeout(()=>{
document.getElementById("result").innerHTML = "";
load();
},1200);

}

load();

</script>

</body>
</html>
