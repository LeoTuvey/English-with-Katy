<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game 4 - Grammar Challenge</title>

<style>
  body {
    font-family: Arial;
    background: linear-gradient(135deg, #e3f2fd, #fce4ec);
    text-align: center;
    margin: 0;
  }

  h1 {
    color: #2c3e50;
    margin-top: 10px;
  }

  #topBar {
    display: flex;
    justify-content: space-around;
    margin: 10px;
  }

  .box {
    background: white;
    padding: 10px 15px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }

  #question {
    font-size: 28px;
    margin: 25px;
    padding: 10px;
  }

  .btn {
    display: inline-block;
    padding: 12px 18px;
    margin: 10px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 18px;
    color: white;
  }

  .a { background: #2196F3; }
  .an { background: #4CAF50; }
  .the { background: #FF9800; }

  #feedback {
    font-size: 24px;
    margin: 10px;
  }

  .next {
    background: #333;
    color: white;
    padding: 10px 15px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 10px;
  }
</style>
</head>

<body>

<h1>⭐ Game 4: Grammar Challenge</h1>

<div id="topBar">
  <div class="box">⭐ Score: <span id="score">0</span></div>
  <div class="box">📊 Level: <span id="level">1</span></div>
</div>

<div id="question"></div>

<div>
  <div class="btn a" onclick="answer('a')">A</div>
  <div class="btn an" onclick="answer('an')">AN</div>
  <div class="btn the" onclick="answer('the')">THE</div>
</div>

<p id="feedback"></p>

<button class="next" onclick="next()">➡️ Next</button>

<script>

// 💾 PROGRESS SYSTEM
function saveProgress(game, score) {
  localStorage.setItem(game + "_score", score);
}

function loadProgress(game) {
  return parseInt(localStorage.getItem(game + "_score")) || 0;
}

// 🎮 GAME DATA
const game = [
  { text: "___ apple 🍎", answer: "an" },
  { text: "___ cat 🐱", answer: "a" },
  { text: "___ elephant 🐘", answer: "an" },
  { text: "___ sun ☀️", answer: "the" },
  { text: "___ dog 🐶", answer: "a" },
  { text: "___ owl 🦉", answer: "an" },
  { text: "___ car 🚗", answer: "a" },
  { text: "___ moon 🌙", answer: "the" }
];

let current = 0;

// 🔥 LOAD SCORE
let score = loadProgress("game4");
document.getElementById("score").innerText = score;

// 🔊 SPEAK
function speak(text) {
  speechSynthesis.speak(new SpeechSynthesisUtterance(text));
}

// 📥 LOAD QUESTION
function load() {
  const item = game[current];

  document.getElementById("question").innerText = item.text;
  document.getElementById("level").innerText = current + 1;
  document.getElementById("feedback").innerText = "";
}

// ✅ ANSWER CHECK
function answer(choice) {
  const correct = game[current].answer;

  if (choice === correct) {
    score += 10;
    document.getElementById("score").innerText = score;

    saveProgress("game4", score);

    document.getElementById("feedback").innerText = "🎉 Correct!";
    speak("Correct");

  } else {
    document.getElementById("feedback").innerText = "😕 Try again!";
    speak("Try again");
  }
}

// ➡️ NEXT
function next() {
  current++;

  if (current >= game.length) {
    current = 0;
    alert("🎉 Finished Game 4! Score: " + score);
  }

  load();
}

load();

</script>

</body>
</html>
