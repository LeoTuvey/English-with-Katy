<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Run After / Run From Game</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background:#f7fbff;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
}

/* 🌍 VISUAL AREA */
.scene{
    height:260px;
    border:3px solid #333;
    border-radius:15px;
    position:relative;
    background:linear-gradient(to top,#d0f5c8 40%,#cfe8ff 40%);
    overflow:hidden;
}

/* 🐾 ANIMALS */
.actor, .target{
    position:absolute;
    bottom:40px;
    font-size:110px;
    transition: all 3s linear;
}

.actor{ left:10%; }
.target{ left:60%; }

.chase .actor{ left:45%; }
.chase .target{ left:75%; }

.escape .actor{ left:10%; }
.escape .target{ left:50%; }

/* 📘 SENTENCE BOX (IMPORTANT FIX) */
.sentenceBox{
    margin-top:15px;
    font-size:22px;
    font-weight:bold;
    background:#f4f4f4;
    padding:10px;
    border-radius:10px;
}

/* 🧠 MEANING BOX */
.meaningBox{
    margin-top:10px;
    font-size:16px;
    color:#333;
    background:#e8f3ff;
    padding:8px;
    border-radius:10px;
}

/* ❓ OPTIONS */
button{
    width:95%;
    padding:14px;
    margin:8px;
    font-size:18px;
    border:none;
    border-radius:10px;
    background:#1976d2;
    color:white;
    cursor:pointer;
}

#result{
    font-size:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>🐾 Run After / Run From</h1>

<div class="scene" id="scene"></div>

<div class="sentenceBox" id="sentence"></div>

<div class="meaningBox" id="meaning"></div>

<div id="options"></div>

<div id="result"></div>

</div>

<script>

function speak(text){
    let msg = new SpeechSynthesisUtterance(text);
    msg.lang = "en-US";
    msg.rate = 0.78;
    msg.pitch = 1.25;
    speechSynthesis.speak(msg);
}

/* 🧠 DATA */
const questions = [

{
actor:"🐱",
target:"🐶",
sentence:"The cat is running after the dog.",
type:"chase",
meaning:"run after = chase",
correctAnswer:"run after"
},

{
actor:"🐶",
target:"🐱",
sentence:"The dog is running from the cat.",
type:"escape",
meaning:"run from = escape",
correctAnswer:"run from"
}

];

let i = 0;

function load(){

if(i >= questions.length){
speak("Great job!");
document.getElementById("scene").innerHTML = "🎉 Finished!";
return;
}

let q = questions[i];

speechSynthesis.cancel();

/* RESET */
let scene = document.getElementById("scene");
scene.className = "";

/* VISUAL */
scene.innerHTML = `
<div class="actor">${q.actor}</div>
<div class="target">${q.target}</div>
`;

/* TEXT (CLEAR STRUCTURE) */
document.getElementById("sentence").innerText = q.sentence;
document.getElementById("meaning").innerText = q.meaning;

/* ANIMATION */
setTimeout(()=>{
    scene.classList.add(q.type);
},800);

/* VOICE */
setTimeout(()=> speak(q.sentence), 400);

/* OPTIONS */
let html = "";

["run after","run from"].forEach((a)=>{
html += `<button onclick="check('${a}')">${a}</button>`;
});

document.getElementById("options").innerHTML = html;

}

function check(answer){

if(answer === questions[i].correctAnswer){
document.getElementById("result").innerHTML = "✅ Correct!";
speak("Correct!");
}else{
document.getElementById("result").innerHTML = "❌ Try again!";
speak("Try again!");
}

i++;

setTimeout(()=>{
document.getElementById("result").innerHTML = "";
load();
},1500);

}

load();

</script>

</body>
</html>
