<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Who is chasing who?</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background:linear-gradient(135deg,#f6d365,#fda085);
    padding:20px;
}

.container{
    max-width:750px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 12px rgba(0,0,0,0.2);
}

h1{
    margin-bottom:10px;
}

#imageBox img{
    width:100%;
    max-height:320px;
    object-fit:cover;
    border-radius:12px;
    margin:15px 0;
}

.story{
    font-size:18px;
    margin:10px 0;
    color:#333;
}

.question{
    font-size:20px;
    font-weight:bold;
    margin:10px 0;
}

button{
    padding:14px;
    margin:10px 0;
    width:90%;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#4a90e2;
    color:white;
}

button:hover{
    opacity:0.9;
}

#score{
    font-size:18px;
    margin:10px;
}

#result{
    font-size:20px;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<h1>🦊 Who is chasing who?</h1>

<div id="score">Score: 0</div>

<div id="imageBox"></div>

<div class="story" id="story"></div>

<div class="question" id="question"></div>

<div id="options"></div>

<div id="result"></div>

</div>

<script>

const questions = [
{
img:"https://images.unsplash.com/photo-1522926193341-e9ffd686c04c",
story:"A fox sees a rabbit and starts chasing it in the forest.",
question:"What does the fox do?",
answer:"runs after"
},
{
img:"https://images.unsplash.com/photo-1526336024174-e58f5cdd8e13",
story:"The rabbit is scared and runs away quickly.",
question:"What does the rabbit do?",
answer:"runs from"
},
{
img:"https://images.unsplash.com/photo-1517841905240-472988babdf9",
story:"Saman is chasing Shilan in the school yard.",
question:"What does Saman do?",
answer:"runs after"
},
{
img:"https://images.unsplash.com/photo-1520975682031-a9b3a3d8f7a0",
story:"Shilan is afraid and runs away from Saman.",
question:"What does Shilan do?",
answer:"runs from"
},

// 🔥 FIXED PART (CAT → DOG NOW CORRECT)
{
img:"https://images.unsplash.com/photo-1518020382113-a7e8fc38eac9",
story:"A cat sees a dog and starts chasing it.",
question:"What does the cat do?",
answer:"runs after"
}
];

let current = 0;
let score = 0;

function loadQuestion(){

if(current >= questions.length){
    document.getElementById("imageBox").innerHTML = "";
    document.getElementById("story").innerHTML = "";
    document.getElementById("question").innerHTML = "";
    document.getElementById("options").innerHTML = "";
    document.getElementById("result").innerHTML =
    "🎉 Game Finished! Final Score: " + score + "/" + questions.length;
    return;
}

document.getElementById("imageBox").innerHTML =
`<img src="${questions[current].img}">`;

document.getElementById("story").innerHTML =
questions[current].story;

document.getElementById("question").innerHTML =
questions[current].question;

let options = ["runs after","runs from"];

let html = "";

options.forEach(opt=>{
    html += `<button onclick="check('${opt}')">${opt}</button>`;
});

document.getElementById("options").innerHTML = html;

}

function check(answer){

if(answer === questions[current].answer){
    score++;
    document.getElementById("result").innerHTML = "✅ Correct!";
}else{
    document.getElementById("result").innerHTML =
    "❌ Wrong! Correct answer: " + questions[current].answer;
}

document.getElementById("score").innerHTML =
"Score: " + score;

current++;

setTimeout(()=>{
    document.getElementById("result").innerHTML = "";
    loadQuestion();
},1200);

}

loadQuestion();

</script>

</body>
</html>
