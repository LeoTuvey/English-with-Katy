<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Run After / Run From Game</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background:#f7fbff;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
}

h1{
    margin-bottom:10px;
}

.scene{
    height:260px;
    border:3px solid #333;
    border-radius:15px;
    position:relative;
    background:linear-gradient(to top,#d0f5c8 40%,#cfe8ff 40%);
    overflow:hidden;
}

/* 🐾 BASE POSITIONS */
.actor, .target{
    position:absolute;
    bottom:40px;
    font-size:110px;
    transition: all 3s linear;
}

/* left start positions */
.actor{
    left:10%;
}

.target{
    left:60%;
}

/* CHASE STATE */
.chase .actor{
    left:45%;
}

.chase .target{
    left:75%;
}

/* ESCAPE STATE */
.escape .actor{
    left:10%;
}

.escape .target{
    left:50%;
}

/* speech bubble */
.bubble{
    position:absolute;
    top:10px;
    left:10px;
    background:white;
    border:2px solid #333;
    padding:10px;
    border-radius:10px;
    font-weight:bold;
    font-size:16px;
    max-width:70%;
    text-align:left;
}

button{
    width:95%;
    padding:14px;
    margin:8px;
    font-size:18px;
    border:none;
    border-radius:10px;
    background:#1976d2;
    color:white;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

#result{
    font-size:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>🐾 Run After / Run From</h1>

<div class="scene" id="scene"></div>

<div id="options"></div>

<div id="result"></div>

</div>

<script>

function speak(text){
    let msg = new SpeechSynthesisUtterance(text);
    msg.lang = "en-US";
    msg.rate = 0.78;
    msg.pitch = 1.25;

    let voices = speechSynthesis.getVoices();
    msg.voice = voices[0];

    speechSynthesis.speak(msg);
}

/* 🧠 DATA WITH MOVEMENT TYPE */
const questions = [

{
actor:"🐱",
target:"🐶",
sentence:"The cat is running after the dog.",
type:"chase",
questions:[
"What does the cat do?",
"What is the cat doing?"
],
correctAnswer:"run after"
},

{
actor:"🐶",
target:"🐱",
sentence:"The dog is running from the cat.",
type:"escape",
questions:[
"What does the dog do?",
"What is the dog doing?"
],
correctAnswer:"run from"
}

];

let i = 0;

function load(){

if(i >= questions.length){
speak("Great job!");
document.getElementById("scene").innerHTML = "🎉 Finished!";
document.getElementById("options").innerHTML = "";
return;
}

let q = questions[i];

speechSynthesis.cancel();

/* RESET */
let scene = document.getElementById("scene");
scene.className = "";

/* SHOW */
scene.innerHTML = `
<div class="bubble">${q.sentence}</div>
<div class="actor">${q.actor}</div>
<div class="target">${q.target}</div>
`;

/* VOICE */
setTimeout(()=> speak(q.sentence), 400);

/* MOVE ANIMATION (based on sentence meaning) */
setTimeout(()=>{

    if(q.type === "chase"){
        scene.classList.add("chase");
    }

    if(q.type === "escape"){
        scene.classList.add("escape");
    }

}, 800);

/* OPTIONS */
let html = "";

q.questions.forEach((qText)=>{
html += `<button onclick="check('${q.correctAnswer}')">${qText}</button>`;
});

document.getElementById("options").innerHTML = html;

}

function check(answer){

if(answer === questions[i].correctAnswer){
document.getElementById("result").innerHTML = "✅ Correct!";
speak("Correct!");
}else{
document.getElementById("result").innerHTML = "❌ Try again!";
speak("Try again!");
}

i++;

setTimeout(()=>{
document.getElementById("result").innerHTML = "";
load();
},1500);

}

load();

</script>

</body>
</html>
