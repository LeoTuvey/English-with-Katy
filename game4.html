<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Run After / Run From Story Game</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background:linear-gradient(135deg,#f6d365,#fda085);
    padding:20px;
}

.container{
    max-width:750px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 12px rgba(0,0,0,0.2);
}

h1{
    margin-bottom:10px;
}

.emojiBox{
    font-size:70px;
    margin:20px 0;
}

.story{
    font-size:18px;
    margin:10px 0;
    color:#333;
}

.question{
    font-size:20px;
    font-weight:bold;
    margin:10px 0;
}

button{
    padding:14px;
    margin:10px 0;
    width:90%;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#4a90e2;
    color:white;
}

button:hover{
    opacity:0.9;
}

#score{
    font-size:18px;
    margin:10px;
}

#result{
    font-size:20px;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<h1>🏃 Run After / Run From Game</h1>

<div id="score">Score: 0</div>

<div class="emojiBox" id="emojiBox"></div>

<div class="story" id="story"></div>

<div class="question" id="question"></div>

<div id="options"></div>

<div id="result"></div>

</div>

<script>

const questions = [
{
emoji:"🦊➡️🐇",
story:"Fox sees Rabbit in the forest.",
question:"What does Fox do?",
answer:"runs after"
},
{
emoji:"🐇➡️💨",
story:"Rabbit sees Fox and is scared.",
question:"What does Rabbit do?",
answer:"runs from"
},
{
emoji:"🐱➡️🐶",
story:"Cat sees Dog in the street.",
question:"What does Cat do?",
answer:"runs after"
},
{
emoji:"🐶➡️💨",
story:"Dog sees Cat and escapes.",
question:"What does Dog do?",
answer:"runs from"
},

{
emoji:"🧒➡️👧",
story:"Saman is chasing Shilan in the yard.",
question:"What does Saman do?",
answer:"runs after"
},
{
emoji:"👧➡️💨",
story:"Shilan runs away from Saman.",
question:"What does Shilan do?",
answer:"runs from"
},

{
emoji:"👩➡️👦",
story:"Katy is chasing Haron in the park.",
question:"What does Katy do?",
answer:"runs after"
},
{
emoji:"👦➡️💨",
story:"Haron runs away from Katy.",
question:"What does Haron do?",
answer:"runs from"
},

{
emoji:"🧑➡️🧑",
story:"Barzan is chasing Mobin in school.",
question:"What does Barzan do?",
answer:"runs after"
},
{
emoji:"🧑➡️💨",
story:"Mobin runs away from Barzan.",
question:"What does Mobin do?",
answer:"runs from"
},

{
emoji:"🧑➡️🧑",
story:"Beriwan is chasing Mansor in the playground.",
question:"What does Beriwan do?",
answer:"runs after"
},
{
emoji:"🧑➡️💨",
story:"Mansor runs away from Beriwan.",
question:"What does Mansor do?",
answer:"runs from"
},

{
emoji:"🧑➡️🧑",
story:"Dildar is chasing Saman in the field.",
question:"What does Dildar do?",
answer:"runs after"
}
];

let current = 0;
let score = 0;

function loadQuestion(){

if(current >= questions.length){
    document.getElementById("emojiBox").innerHTML = "";
    document.getElementById("story").innerHTML = "";
    document.getElementById("question").innerHTML = "";
    document.getElementById("options").innerHTML = "";
    document.getElementById("result").innerHTML =
    "🎉 Game Finished! Final Score: " + score + "/" + questions.length;
    return;
}

document.getElementById("emojiBox").innerHTML =
questions[current].emoji;

document.getElementById("story").innerHTML =
questions[current].story;

document.getElementById("question").innerHTML =
questions[current].question;

let options = ["runs after","runs from"];

let html = "";

options.forEach(opt=>{
    html += `<button onclick="check('${opt}')">${opt}</button>`;
});

document.getElementById("options").innerHTML = html;

}

function check(answer){

if(answer === questions[current].answer){
    score++;
    document.getElementById("result").innerHTML = "✅ Correct!";
}else{
    document.getElementById("result").innerHTML =
    "❌ Wrong! Correct answer: " + questions[current].answer;
}

document.getElementById("score").innerHTML =
"Score: " + score;

current++;

setTimeout(()=>{
    document.getElementById("result").innerHTML = "";
    loadQuestion();
},1200);

}

loadQuestion();

</script>

</body>
</html>
