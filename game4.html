<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Run After / Run From Game</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background:#f7fbff;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
}

h1{
    margin-bottom:10px;
}

.scene{
    height:260px;
    border:3px solid #333;
    border-radius:15px;
    position:relative;
    background:linear-gradient(to top,#d0f5c8 40%,#cfe8ff 40%);
    overflow:hidden;
}

/* ANIMATION */
.actor, .target{
    position:absolute;
    bottom:40px;
    font-size:110px;
    transition: all 3s linear;
}

.actor{ left:10%; }
.target{ left:60%; }

.chase .actor{ left:45%; }
.chase .target{ left:75%; }

.escape .actor{ left:10%; }
.escape .target{ left:50%; }

/* TEXT */
.sentenceBox{
    margin-top:15px;
    font-size:22px;
    font-weight:bold;
}

.meaningBox{
    margin-top:10px;
    font-size:16px;
    background:#e8f3ff;
    padding:8px;
    border-radius:10px;
}

/* BUTTONS */
button{
    width:95%;
    padding:14px;
    margin:8px;
    font-size:18px;
    border:none;
    border-radius:10px;
    background:#1976d2;
    color:white;
    cursor:pointer;
}

#result{
    font-size:20px;
    font-weight:bold;
}

/* FINAL SCREEN */
.finalBox{
    margin-top:20px;
    font-size:24px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>🐾 Run After / Run From</h1>

<div class="scene" id="scene"></div>

<div class="sentenceBox" id="sentence"></div>

<div class="meaningBox" id="meaning"></div>

<div id="options"></div>

<div id="result"></div>

<div id="final"></div>

</div>

<script>

/* 🔊 VOICE */
function speak(text){
    let msg = new SpeechSynthesisUtterance(text);
    msg.lang = "en-US";
    msg.rate = 0.78;
    msg.pitch = 1.25;
    speechSynthesis.speak(msg);
}

/* 🧠 DATA */
const questions = [

{actor:"🐱 Cat", target:"🐭 Mouse", sentence:"The cat is running after the mouse.", type:"chase", meaning:"run after = chase", answer:"run after"},
{actor:"🐶 Dog", target:"🐱 Cat", sentence:"The dog is running after the cat.", type:"chase", meaning:"run after = chase", answer:"run after"},
{actor:"🦊 Fox", target:"🐰 Rabbit", sentence:"The fox is running after the rabbit.", type:"chase", meaning:"run after = chase", answer:"run after"},
{actor:"🐭 Mouse", target:"🐱 Cat", sentence:"The mouse is running from the cat.", type:"escape", meaning:"run from = escape", answer:"run from"},
{actor:"🐰 Rabbit", target:"🦊 Fox", sentence:"The rabbit is running from the fox.", type:"escape", meaning:"run from = escape", answer:"run from"}

];

let i = 0;
let score = 0;

/* LOAD GAME */
function load(){

if(i >= questions.length){
showFinal();
return;
}

let q = questions[i];

speechSynthesis.cancel();

let scene = document.getElementById("scene");
scene.className = "";

scene.innerHTML = `
<div class="actor">${q.actor}</div>
<div class="target">${q.target}</div>
`;

document.getElementById("sentence").innerText = q.sentence;
document.getElementById("meaning").innerText = q.meaning;

setTimeout(()=> scene.classList.add(q.type), 800);
setTimeout(()=> speak(q.sentence), 400);

let html = "";

["run after","run from"].forEach(a=>{
html += `<button onclick="check('${a}')">${a}</button>`;
});

document.getElementById("options").innerHTML = html;

}

/* CHECK ANSWER */
function check(ans){

if(ans === questions[i].answer){
score++;
document.getElementById("result").innerHTML = "✅ Correct!";
speak("Correct!");
}else{
document.getElementById("result").innerHTML = "❌ Try again!";
speak("Try again!");
}

i++;

setTimeout(()=>{
document.getElementById("result").innerHTML = "";
load();
},1500);

}

/* 🏆 FINAL GRADE SYSTEM */
function showFinal(){

let grade = "";

if(score >= 5){
grade = "A ⭐ Excellent!";
}
else if(score >= 4){
grade = "B 👍 Good!";
}
else if(score >= 3){
grade = "C 🙂 OK!";
}
else{
grade = "D ❌ Needs Practice";
}

document.getElementById("scene").innerHTML = "🎉 Finished!";
document.getElementById("sentence").innerHTML = "";
document.getElementById("meaning").innerHTML = "";
document.getElementById("options").innerHTML = "";

document.getElementById("final").innerHTML = `
<div class="finalBox">
🏆 Score: ${score} / ${questions.length}<br><br>
🎓 Grade: ${grade}
</div>
`;

speak("Game finished. Your grade is " + grade);
}

load();

</script>

</body>
</html>
