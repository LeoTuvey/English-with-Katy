<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Game 4</title>

<style>
body { font-family: Arial; text-align:center; background:#e3f2fd; margin:0; }
h1 { margin-top:15px; }
#score { font-size:18px; margin:10px; }
#emoji { font-size:60px; margin:20px; }
#text { font-size:22px; }
button { padding:12px 20px; margin:8px; border:none; border-radius:10px; font-size:18px; cursor:pointer; }
.correct { background:#4CAF50; color:white; }
.wrong { background:#f44336; color:white; }
</style>
</head>

<body>

<h1>🐱 Game 4 - Singular & Plural</h1>

<div id="score">⭐ Score: 0</div>

<div id="emoji">🐱</div>
<div id="text">There is a cat</div>

<button class="correct" onclick="answer(true)">Correct</button>
<button class="wrong" onclick="answer(false)">Wrong</button>

<div id="feedback"></div>

<button onclick="next()">Next ➡️</button>

<script>

function saveScore(g,s){
  localStorage.setItem(g+"_score",s);
}

function loadScore(g){
  return parseInt(localStorage.getItem(g+"_score"))||0;
}

let gameId = "game4";
let score = loadScore(gameId);

document.getElementById("score").innerText = "⭐ Score: " + score;

const q = [
  {emoji:"🐱", text:"There is a cat", correct:true},
  {emoji:"🐱🐱", text:"There are 2 cats", correct:true},
  {emoji:"🐶", text:"There is a dog", correct:true},
  {emoji:"🐶🐶", text:"There is a dog", correct:false},
  {emoji:"🍎🍎", text:"There are 2 apples", correct:true},
  {emoji:"🍎", text:"There are 2 apples", correct:false}
];

let i = 0;

function load(){
  document.getElementById("emoji").innerText = q[i].emoji;
  document.getElementById("text").innerText = q[i].text;
  document.getElementById("feedback").innerText = "";
}

function answer(a){
  if(a === q[i].correct){
    score += 10;
    saveScore(gameId, score);
    document.getElementById("score").innerText = "⭐ Score: " + score;
    document.getElementById("feedback").innerText = "✅ Correct!";
  } else {
    document.getElementById("feedback").innerText = "❌ Try again!";
  }
}

function next(){
  i++;
  if(i >= q.length){
    i = 0;
    alert("Finished Game 4! Score: " + score);
  }
  load();
}

load();

</script>

</body>
</html>
