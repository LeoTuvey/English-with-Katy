<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>English with Katy - Learning Journey</title>

<style>
  body {
    font-family: Arial;
    margin: 0;
    background: linear-gradient(135deg, #e3f2fd, #fce4ec);
    text-align: center;
  }

  h1 {
    margin-top: 20px;
    color: #2c3e50;
  }

  .subtitle {
    color: #555;
    margin-bottom: 10px;
  }

  /* 🧭 LEVEL BLOCKS */
  .level {
    width: 90%;
    max-width: 500px;
    margin: 20px auto;
    background: white;
    border-radius: 15px;
    padding: 15px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    text-align: left;
  }

  .level-title {
    font-weight: bold;
    margin-bottom: 10px;
    font-size: 18px;
  }

  /* 🎮 GAME BUTTONS */
  .game {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    margin: 8px 0;
    border-radius: 10px;
    text-decoration: none;
    color: black;
    background: #f7f7f7;
    transition: 0.2s;
  }

  .game:hover {
    transform: scale(1.02);
  }

  .left {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .emoji {
    font-size: 22px;
  }

  .locked {
    opacity: 0.4;
    pointer-events: none;
  }

  .stars {
    font-size: 14px;
    color: gold;
  }

</style>
</head>

<body>

<h1>📚 English with Katy</h1>
<p class="subtitle">Your Learning Journey 🎓</p>

<!-- 🟢 LEVEL 1 -->
<div class="level">
  <div class="level-title">🟢 Level 1: Basics</div>

  <a class="game" href="game1.html" id="g1">
    <div class="left">
      <div class="emoji">🏃‍♂️</div>
      <div>Daily Actions</div>
    </div>
    <div class="stars" id="s1">☆☆☆</div>
  </a>

  <a class="game" href="game2.html" id="g2">
    <div class="left">
      <div class="emoji">✔️❌</div>
      <div>True or False</div>
    </div>
    <div class="stars" id="s2">☆☆☆</div>
  </a>
</div>

<!-- 🟡 LEVEL 2 -->
<div class="level">
  <div class="level-title">🟡 Level 2: Grammar</div>

  <a class="game" href="game3.html" id="g3">
    <div class="left">
      <div class="emoji">📍</div>
      <div>This / That / These / Those</div>
    </div>
    <div class="stars" id="s3">☆☆☆</div>
  </a>

  <a class="game" href="game4.html" id="g4">
    <div class="left">
      <div class="emoji">⭐</div>
      <div>A / An / Plurals</div>
    </div>
    <div class="stars" id="s4">☆☆☆</div>
  </a>
</div>

<!-- 🔵 LEVEL 3 -->
<div class="level">
  <div class="level-title">🔵 Level 3: Communication</div>

  <a class="game" href="game7.html" id="g7">
    <div class="left">
      <div class="emoji">🧩</div>
      <div>Word Builder</div>
    </div>
    <div class="stars" id="s7">☆☆☆</div>
  </a>

  <a class="game" href="game8.html" id="g8">
    <div class="left">
      <div class="emoji">🖼️</div>
      <div>Picture Match</div>
    </div>
    <div class="stars" id="s8">☆☆☆</div>
  </a>
</div>

<script>

// 💾 LOAD SCORE
function getScore(game) {
  return parseInt(localStorage.getItem(game + "_score")) || 0;
}

// ⭐ CONVERT SCORE TO STARS
function getStars(score) {
  if (score >= 80) return "⭐⭐⭐";
  if (score >= 50) return "⭐⭐";
  if (score >= 20) return "⭐";
  return "☆☆☆";
}

// 🔓 UNLOCK LOGIC
function unlock(gameId, required) {
  const score = getScore(gameId);
  return score >= required;
}

// 📊 UPDATE UI
function update() {

  // Game 1
  document.getElementById("s1").innerText = getStars(getScore("game1"));

  // Game 2
  document.getElementById("s2").innerText = getStars(getScore("game2"));

  // Game 3
  document.getElementById("s3").innerText = getStars(getScore("game3"));

  // Game 4
  document.getElementById("s4").innerText = getStars(getScore("game4"));

  // Game 7
  document.getElementById("s7").innerText = getStars(getScore("game7"));

  // Game 8
  document.getElementById("s8").innerText = getStars(getScore("game8"));

  // 🔒 LOCK SYSTEM (example progression)
  if (!unlock("game1", 10)) document.getElementById("g2").classList.add("locked");
  if (!unlock("game2", 10)) document.getElementById("g3").classList.add("locked");
  if (!unlock("game3", 10)) document.getElementById("g4").classList.add("locked");
  if (!unlock("game4", 10)) document.getElementById("g7").classList.add("locked");
  if (!unlock("game7", 10)) document.getElementById("g8").classList.add("locked");
}

update();

</script>

</body>
</html>
