<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Is there / Are there Quiz</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background:#eef7ff;
    padding:20px;
}

.container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
}

h1{
    margin-bottom:10px;
}

#score{
    font-size:20px;
    font-weight:bold;
    margin:10px;
}

.scene{
    height:280px;
    border:3px solid #333;
    border-radius:15px;
    position:relative;
    margin-bottom:20px;
    background:linear-gradient(to top,#c8f7c5 40%,#bfe7ff 40%);
}

.hereObj{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    font-size:130px;
}

.thereObj{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    font-size:60px;
    opacity:0.85;
}

.hereLabel{
    position:absolute;
    bottom:10px;
    left:10px;
    background:white;
    color:green;
    border:2px solid green;
    padding:6px 12px;
    border-radius:10px;
    font-weight:bold;
}

.thereLabel{
    position:absolute;
    top:10px;
    right:10px;
    background:white;
    color:red;
    border:2px solid red;
    padding:6px 12px;
    border-radius:10px;
    font-weight:bold;
}

.questionBox{
    position:absolute;
    top:50%;
    left:10px;
    transform:translateY(-50%);
    width:45%;
    font-size:22px;
    font-weight:bold;
    text-align:left;
    color:#222;
    line-height:1.4;
}

button{
    width:95%;
    padding:14px;
    margin:8px;
    font-size:18px;
    border:none;
    border-radius:10px;
    background:#1976d2;
    color:white;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

#result{
    font-size:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>❓ Is there / Are there Quiz</h1>

<div id="score">Score: 0</div>

<div class="scene" id="scene"></div>

<div id="options"></div>

<div id="result"></div>

</div>

<script>

/* 🔊 KID-CLEAR FRIENDLY VOICE (BEST BROWSER VERSION) */
function speak(text){

    let msg = new SpeechSynthesisUtterance(text);

    msg.lang = "en-US";

    // 👶 kid-friendly settings
    msg.rate = 0.78;   // slower = easier to understand
    msg.pitch = 1.25;  // softer + friendly tone
    msg.volume = 1;

    let voices = speechSynthesis.getVoices();

    // 🎯 choose best clear female voice available
    let voice =
        voices.find(v => v.name.includes("Google UK English Female")) ||
        voices.find(v => v.name.includes("Microsoft Zira")) ||
        voices.find(v => v.name.includes("Samantha")) ||
        voices.find(v => v.lang.includes("en-US")) ||
        voices[0];

    if(voice){
        msg.voice = voice;
    }

    speechSynthesis.speak(msg);
}

const questions = [

{
obj:"🐈",
pos:"here",
question:"Is there a cat here?",
answers:[
"Yes, there is.",
"No, there isn't. It's there."
],
correct:0
},

{
obj:"🐶",
pos:"there",
question:"Is there a dog here?",
answers:[
"No, it isn't here. It's there.",
"Yes, there is."
],
correct:0
},

{
obj:"🐰🐰",
pos:"there",
question:"Are there two rabbits here?",
answers:[
"No, there aren't. They're there.",
"Yes, there are."
],
correct:0
},

{
obj:"🦊🦊",
pos:"here",
question:"Are there two foxes there?",
answers:[
"No, there aren't. They're here.",
"Yes, there are."
],
correct:0
},

{
obj:"🐈🐈",
pos:"there",
question:"Are there two cats here?",
answers:[
"No, there aren't. They're there.",
"Yes, there are."
],
correct:0
},

{
obj:"🐶",
pos:"here",
question:"Is there a dog there?",
answers:[
"No, it isn't there. It's here.",
"Yes, there is."
],
correct:0
}

];

let i = 0;
let score = 0;

function load(){

if(i >= questions.length){

speechSynthesis.cancel();
speak("Great job! You finished the game!");

document.getElementById("scene").innerHTML =
"🎉 Finished! Score: " + score;

document.getElementById("options").innerHTML = "";
return;
}

let q = questions[i];

speechSynthesis.cancel();
setTimeout(() => speak(q.question), 400);

document.getElementById("scene").innerHTML = `

<div class="hereLabel">HERE (close)</div>
<div class="thereLabel">THERE (far)</div>

<div class="${q.pos === 'here' ? 'hereObj' : 'thereObj'}">
${q.obj}
</div>

<div class="questionBox">
${q.question}
</div>

`;

let html = "";

q.answers.forEach((a, index) => {
html += `
<button onclick="check(${index})">${a}</button>
`;
});

document.getElementById("options").innerHTML = html;

}

function check(ans){

if(ans === questions[i].correct){
score++;
document.getElementById("result").innerHTML = "✅ Correct!";
}else{
document.getElementById("result").innerHTML = "❌ Wrong!";
}

document.getElementById("score").innerHTML = "Score: " + score;

i++;

setTimeout(()=>{
document.getElementById("result").innerHTML = "";
load();
},1200);

}

load();

</script>

</body>
</html>
